// Filas de la cascada: cada paso con su importe (sobre el total de ingresos)
// Filas fijas de la cascada: si alguno de los dos periodos tiene IRPF, ambos llevan las mismas filas (evita listas desalineadas)
function cascadeItems(A, showTax) {
  var items = [
    ['Ingresos', A.rev, 'total'], ['Materias primas y mermas', A.mat, 'cost'], ['Envases', A.envases, 'cost'],
    ['Comisiones y reparto', A.comReparto, 'cost'], ['Personal', A.personal, 'cost'], ['Alquiler', A.alquiler, 'cost'],
    ['Energía y agua', A.energia, 'cost'], ['Otros fijos', A.otrosFijos, 'cost'], ['Amortización e intereses', A.amortInt, 'cost'],
    ['Beneficio (BAI)', A.bai, 'result']
  ];
  if (showTax) items.push(['IRPF estimado (dueña autónoma)', A.tax, 'cost'], ['Beneficio después de IRPF', A.bai - A.tax, 'result']);
  return items;
}
function cascadeBars(items) {
  var cum = 0, out = [];
  items.forEach(function (it) {
    var v = it[1], kind = it[2], a, b;
    if (kind === 'total') { a = 0; b = v; cum = v; }
    else if (kind === 'cost') { a = cum - v; b = cum; cum = a; }
    else { a = 0; b = Math.max(v, 0); cum = v; }
    out.push({ a: a, b: b, kind: kind, v: v, lab: it[0] });
  });
  return out;
}
CHARTS.cascada = function (w) {
  var A = agg(pickP(ST.period)), C = cmpOn() ? agg(pickRows(ROWS, cmpInfo(ST.period).ks)) : null;
  var showTax = A.tax > 0 || (C !== null && C.tax > 0);
  var items = cascadeItems(A, showTax), bars = cascadeBars(items);
  var cbars = C ? cascadeBars(cascadeItems(C, showTax)) : null;
  var lw = w < 520 ? Math.min(w * 0.4, 150) : 220;
  var vw = C ? 104 : 96, rowH = C ? 46 : 32, top = 6;
  var pw = w - lw - vw - 8;
  // Escala común: el mayor de los ingresos (actual o comparado) ocupa todo el ancho útil
  var maxV = Math.max(A.rev, C ? C.rev : 0);
  var X = function (v) { return lw + Math.max(0, v) / maxV * pw; };
  var h = top + items.length * rowH + 8;
  var ids = { ing: gid(), cost: gid(), ok: gid(), err: gid() };
  var s = '<defs>' + gradDef(ids.ing, 'var(--brand)', 0.7) + gradDef(ids.cost, 'var(--choco)', 0.6) + gradDef(ids.ok, 'var(--ok)', 0.6) + gradDef(ids.err, 'var(--err)', 0.6) + '</defs>';
  bars.forEach(function (b, i) {
    var y = top + i * rowH;
    var x1 = X(Math.min(b.a, b.b)), x2 = X(Math.max(b.a, b.b));
    var col = b.kind === 'total' ? ids.ing : b.kind === 'cost' ? ids.cost : (b.v >= 0 ? ids.ok : ids.err);
    var nm = w < 520 ? b.lab.replace('Materias primas y mermas', 'Materias primas').replace('Comisiones y reparto', 'Comisiones').replace('Amortización e intereses', 'Amortización') : b.lab;
    var lab = negS(b.kind === 'cost' ? -Math.abs(b.v) : b.v) + fE(Math.abs(b.v));
    if (!C) {
      s += txt(lw - 10, y + rowH / 2 + 4, nm, 'end', 'bf-lbl');

      s += txt(w - 2, y + rowH / 2 + 4, lab, 'end', 'bf-val');
      return;
    }
    var cb = cbars[i];
    if (!cb) return;
    s += txt(lw - 10, y + rowH / 2 + 4, nm, 'end', 'bf-lbl');
    s += '<rect x="' + x1.toFixed(1) + '" y="' + (y + 6) + '" width="' + Math.max(4, x2 - x1).toFixed(1) + '" height="14" rx="4" fill="url(#' + col + ')"/>';

    s += txt(w - 2, y + 17, lab, 'end', 'bf-val');
    s += txt(w - 2, y + 38, negS(cb.kind === 'cost' ? -Math.abs(cb.v) : cb.v) + fE(Math.abs(cb.v)), 'end', 'bf-cmpval');

// Anillos del donut: exterior = periodo actual; interior fino = comparación
function ringArcs(parts, total, Ro, Ri, cx, cy) {
  var a0 = -Math.PI / 2, out = '';

  parts.forEach(function (p) {
    var frac = total ? p[1] / total : 0;

    var a1 = a0 + frac * 2 * Math.PI, large = frac > 0.5 ? 1 : 0;

    a0 = a1;

}

// ---------- Dibujo y eventos de gráficos ----------
function hydrate() {
  document.querySelectorAll('[data-chart]').forEach(function (el) {
    var name = el.getAttribute('data-chart'), h = +el.getAttribute('data-h') || 260;
    var w = Math.max(240, Math.floor(el.clientWidth || 600));
    // Un gráfico que falla no debe dejar en blanco a los demás
    try {
      el.innerHTML = CHARTS[name](w, h) + '<div class="bf-tip" hidden></div>';
      var svg = el.querySelector('svg');
      if (TIPS[name] && svg) { svg.setAttribute('tabindex', '0'); bindTip(el, name); }
    } catch (err) {
      console.error('Gráfico "' + name + '":', err);
      el.innerHTML = '<p class="bf-sub">No se pudo dibujar este gráfico.</p>';
    }
  });
}
function bindTip(el, name) {
  var t = TIPS[name], svg = el.querySelector('svg'), tip = el.querySelector('.bf-tip');
  var idx = t.n - 1;
  var show = function (i) {
    idx = Math.max(0, Math.min(t.n - 1, i));
    tip.innerHTML = t.tip(idx);
    tip.hidden = false;
    var x = t.x(idx), tw = tip.offsetWidth, W = el.clientWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, x - tw / 2)) + 'px';
  };
  var at = function (e) { var r = svg.getBoundingClientRect(); show(t.idxAt(e.clientX - r.left)); };
  svg.addEventListener('pointermove', at);
  svg.addEventListener('pointerdown', at);
  el.addEventListener('pointerleave', function () { tip.hidden = true; });
  svg.addEventListener('focus', function () { show(idx); });
  svg.addEventListener('blur', function () { tip.hidden = true; });
  svg.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight') show(idx + 1);
    else if (k === 'ArrowLeft') show(idx - 1);
    else if (k === 'Home') show(0);
    else if (k === 'End') show(t.n - 1);
    else if (k === 'Escape') { tip.hidden = true; return; }
    else return;
    e.preventDefault();
  });
}

function partSaveValue(key, raw) {

  } else {
    BF_DATA.customs = BF_DATA.customs.map(function (c) { return c.id === p[2] ? Object.assign({}, c, { importe: Math.round(amt * 100) / 100 }) : c; });

  var k = pickP(ST.period)[0].k, ym = ymOfK(k);
  var current = catSum([ROWS[k]], cat), delta = Math.round((amt - current) * 100) / 100;

    if (ex) {

      BF_DATA.customs.push({ id: 'adj-' + ym + '-' + cat, ym: ym, cat: cat, concepto: 'Ajuste manual', importe: delta, recurrente: false, notas: '', kind: 'ajuste' });
    }

CHARTS.catmini = function (w, h) {
  var cat = ST.drawer ? ST.drawer.cat : 'otros', col = CAT_COL[cat];
  var rows = ROWS.slice(0, 22), n = 22, padL = 44, padR = 6, padT = 14, padB = 28;
  var pw = w - padL - padR, ph = h - padT - padB, bw = pw / n, bar = Math.max(3, bw * 0.6);
  var vals = rows.map(function (r) { return catSum([r], cat); });
  var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
  var Y = function (v) { return padT + (yMax - v) / yMax * ph; };
  var X = function (i) { return padL + (i + 0.5) * bw; };
  var id = gid(), sel = pDef(ST.period).ks, cmpK = cmpOn() ? cmpInfo(ST.period).ks : [];
  var s = '<defs>' + gradDef(id, col, 0.5) + '</defs>';
  ticksOf(0, yMax, 3).forEach(function (v) {
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="bf-grid-l"/>' + txt(padL - 6, Y(v) + 4, fN(v), 'end');
  });
  sel.forEach(function (k) { s += '<rect x="' + (padL + k * bw) + '" y="' + padT + '" width="' + bw + '" height="' + ph + '" class="bf-sel"/>'; });
  cmpK.forEach(function (k) { if (k <= 21) s += cmpBand(padL + k * bw + 2, padT + 1, bw - 4, ph - 2); });
  vals.forEach(function (v, i) {
    s += '<rect x="' + (X(i) - bar / 2) + '" y="' + Y(v) + '" width="' + bar + '" height="' + Math.max(0, padT + ph - Y(v)) + '" rx="2" fill="url(#' + id + ')"/>';
  });
  rows.forEach(function (r, i) {
    if (i % 4) return;
    s += txt(X(i), padT + ph + 16, MES3[r.cm - 1] + (r.cm === 1 ? ' ' + String(r.year).slice(2) : ''));
  });
  TIPS.catmini = {
    n: n, x: X,
    idxAt: function (px) { return Math.floor((px - padL) / bw); },
    tip: function (i) {
      var pr = cmpOn() ? cmpInfo(ST.period).pairs.filter(function (p) { return p.b === i; })[0] : null;
      return '<strong>' + BF_MONTHS[rows[i].cm - 1] + ' ' + rows[i].year + '</strong>' + tl(CAT_NAME[cat], fE(vals[i])) +
        (pr ? tl('Comparación · ' + monthName(ymOfK(pr.c)), fE(catSum([ROWS[pr.c]], cat))) : '');
    }
  };
  return svgOf(w, h, 'Importe mensual de ' + CAT_NAME[cat] + ' de enero de 2025 a octubre de 2026', s);
};

function onEditKey(e) {
  if (pickerKey(e)) return;
  var t = e.target;
  if (t.id === 'bf-inl') {
    if (e.key === 'Enter') { e.preventDefault(); inlineSave(ST.inline); }
    else if (e.key === 'Escape') { e.preventDefault(); ST.inline = null; ST.inlineErr = ''; renderTab(); }
  } else if (t.id === 'bf-part-inp') {
    if (e.key === 'Enter') { e.preventDefault(); partSave(); }
    else if (e.key === 'Escape') { e.preventDefault(); ST.partEdit = null; renderDrawer(true); }
  }
}
function onDocKey(e) {
  if (!ST.drawer) return;
  if (e.key === 'Escape') {
    if (e.target.id === 'bf-inl' || e.target.id === 'bf-part-inp') return;
    e.preventDefault(); closeDrawer(); return;
  }
  if (e.key === 'Tab') {
    var els = focusables($('bf-drawer')), first = els[0], last = els[els.length - 1];
    if (!els.length) return;
    if (e.shiftKey && (document.activeElement === first || !$('bf-drawer').contains(document.activeElement))) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && (document.activeElement === last || !$('bf-drawer').contains(document.activeElement))) { first.focus(); e.preventDefault(); }
  }
}

// ---------- Pestaña Sostenibilidad ----------
function viewSost() {
  var ult = pickRows(ROWS, ULT), AU = agg(ult), last = ROWS[21];
  var beU = breakEven(ult), beO = breakEven([last]);
  var meter = function (real, bev) {
    var mx = Math.max(real, bev) * 1.05;
    return '<div class="bf-meter">' +
      '<div class="bf-meter-row"><span>Ventas reales</span><div class="bf-bar"><i style="width:' + (real / mx * 100).toFixed(1) + '%"></i></div><b>' + fE(real) + '</b></div>' +
      '<div class="bf-meter-row"><span>Punto de equilibrio</span><div class="bf-bar bf-bar-be"><i style="width:' + (bev / mx * 100).toFixed(1) + '%"></i></div><b>' + fE(bev) + '</b></div></div>';
  };
  var beText = function (b) {
    return 'Necesitas ' + fE(b.be) + ' al mes, es decir, unos ' + fN(b.ticketsDay, 0) + ' tickets al día en mostrador, para cubrir gastos.';
  };
  var summerShare = AU.rev ? ult.filter(function (r) { return r.cm >= 6 && r.cm <= 9; }).reduce(function (a, r) { return a + r.rev; }, 0) / AU.rev : 0;
  var diversif = AU.rev ? 1 - AU.revMost / AU.rev : 0;
  var monthsProfit = ult.filter(function (r) { return r.bai > 0; }).length;
  var colchon = last.caja / (AU.fijosCaja / 12);
  var cobertura = AU.ebitda / (660.49 * 12);
  var hist = ROWS.slice(0, 22);
  var maxAbs = Math.max.apply(null, hist.map(function (r) { return Math.abs(r.bai); }));
  var tcol = function (t) {
    return t >= 0 ? 'color-mix(in srgb, var(--ok) ' + (30 + 60 * t).toFixed(0) + '%, var(--surface))'
      : 'color-mix(in srgb, var(--err) ' + (30 + 60 * -t).toFixed(0) + '%, var(--surface))';
  };
  var cal = '<div class="bf-scroll"><div class="bf-cal" role="table" aria-label="Beneficio antes de impuestos por mes y año">' +
    '<div class="bf-h" role="columnheader"></div>' + MES3.map(function (m) { return '<div class="bf-h" role="columnheader">' + m + '</div>'; }).join('');
  [2025, 2026].forEach(function (y) {
    cal += '<div class="bf-ylab" role="rowheader">' + y + '</div>';
    for (var cm = 1; cm <= 12; cm++) {
      var r = ROWS[(y - 2025) * 12 + cm - 1];
      if (!r || r.k >= 22) { cal += '<div class="bf-empty" role="cell">—</div>'; continue; }
      cal += '<div role="cell" style="background:' + tcol(r.bai / maxAbs) + '" aria-label="' + BF_MONTHS[cm - 1] + ' ' + y + ': ' + fE(r.bai) + '">' + fE(r.bai) + '</div>';
    }
  });
  cal += '</div></div>';

  var wr = ROWS.slice(22, 27);
  var net = wr.reduce(function (a, r) { return a + r.bai; }, 0);
  var loss = Math.max(0, -net);
  var caja = last.caja;
  var pctRes = loss > 0 ? Math.min(1, caja / loss) : 1;
  var resTxt = loss > 0
    ? 'Hay que guardar ' + fE(loss) + ' de mayo a septiembre para cubrir las pérdidas previstas de noviembre a marzo (escenario ' + SCEN_LABEL[ST.scen] + ').' +
      (caja >= loss ? ' La caja actual, ' + fE(caja) + ', alcanza.' : ' La caja actual, ' + fE(caja) + ', no alcanza: faltan ' + fE(loss - caja) + '.')
    : 'Con el escenario elegido, noviembre a marzo no cierra en pérdidas: no hace falta reserva.';

  var alerts = [];
  var hMin = hist.reduce(function (a, r) { return r.caja < a.caja ? r : a; }, hist[0]);
  if (hMin.caja < 5000) alerts.push(['warn', 'Aviso: la caja bajó de 5.000 € en ' + BF_MONTHS[hMin.cm - 1].toLowerCase() + ' ' + hMin.year + ' (mínimo ' + fE(hMin.caja) + '). Es el punto más débil de la serie.']);
  var pMin = ROWS.slice(22).reduce(function (a, r) { return r.caja < a.caja ? r : a; }, ROWS[22]);
  if (pMin.caja < 5000) alerts.push(['risk', 'En la proyección la caja baja de 5.000 € en ' + BF_MONTHS[pMin.cm - 1].toLowerCase() + ' ' + pMin.year + '.']);
  else alerts.push(['ok', 'En la proyección del escenario ' + SCEN_LABEL[ST.scen] + ' la caja no baja de 5.000 €. Mínimo: ' + fE(pMin.caja) + ' (' + BF_MONTHS[pMin.cm - 1].toLowerCase() + ' ' + pMin.year + ').']);
  alerts.push([cobertura >= 1.25 ? 'ok' : 'warn', 'La cobertura de la deuda es de ' + fX(cobertura) + ' (referencia: más de 1,25 ×).']);
  alerts.push([last.rev >= beO.be ? 'ok' : 'risk', last.rev >= beO.be ? 'Octubre de 2026 cubrió sus gastos con ' + fE(last.rev - beO.be) + ' de ventas por encima del punto de equilibrio.' : 'Octubre de 2026 no llegó al punto de equilibrio: faltaron ' + fE(beO.be - last.rev) + '.']);
  var negMonths = ult.length - monthsProfit;
  if (negMonths >= 4) alerts.push(['warn', negMonths + ' meses del año móvil cierran en pérdidas.']);
  if (summerShare > 0.5) alerts.push(['warn', 'Más de la mitad de las ventas (' + fP(summerShare, 0) + ') se hacen de junio a septiembre.']);
  var verdict = alerts.map(function (a) {
    var ic = a[0] === 'ok' ? '✓' : a[0] === 'warn' ? '!' : '▲';
    var lab = a[0] === 'ok' ? 'Ok' : a[0] === 'warn' ? 'Aviso' : 'Riesgo';
    return '<div class="bf-alert bf-alert-' + a[0] + '" role="status"><span class="bf-alert-ic" aria-hidden="true">' + ic + '</span><span><b>' + lab + '.</b> ' + esc(a[1]) + '</span></div>';
  }).join('');

  var kpis = [
    kpi('bf-k1', 'Meses en beneficio (año móvil)', monthsProfit + ' de 12', 'de noviembre de 2025 a octubre de 2026', '', null),
    kpi('bf-k2', 'Dependencia del verano', fP(summerShare, 0), '% de las ventas de junio a septiembre', '', null),
    kpi('bf-k3', 'Diversificación', fP(diversif, 0), 'ingresos fuera del mostrador', '', null),
    kpi('bf-k4', 'Meses de colchón', fN(colchon, 1) + ' meses', 'caja actual ÷ gasto fijo medio mensual', '', null),
    kpi('bf-k5', 'Cobertura de la deuda', fX(cobertura), 'EBITDA anual ÷ cuotas anuales (referencia: más de 1,25 ×) ' + (cobertura >= 1.25 ? chip('Bien', 'ok') : chip('Bajo', 'warn')), '', null)
  ].join('');

  return '' +
    '<div class="bf-seg-wrap" style="margin-bottom:6px"><p class="bf-sub">Indicadores del año móvil (noviembre de 2025 a octubre de 2026) salvo que se indique lo contrario. La caja incluye IVA trimestral, retenciones, IRPF (pagos fraccionados y renta) y retiradas de la dueña (2.000 €/mes en temporada alta y 1.150 €/mes el resto del año). Simplificación orientativa: no sustituye el asesoramiento de una gestoría.</p></div>' +
    '<div class="bf-grid2" style="margin-top:0">' +
      '<section class="bf-card" aria-labelledby="h-pe1"><h2 id="h-pe1" class="bf-h2">Punto de equilibrio: octubre de 2026</h2>' +
        '<p class="bf-sub">Último mes completo.</p>' + meter(last.rev, beO.be) +
        '<p class="bf-big-txt">' + beText(beO) + '</p></section>' +
      '<section class="bf-card" aria-labelledby="h-pe2"><h2 id="h-pe2" class="bf-h2">Punto de equilibrio: año móvil</h2>' +
        '<p class="bf-sub">Media mensual de los últimos 12 meses.</p>' + meter(AU.rev / 12, beU.be) +
        '<p class="bf-big-txt">' + beText(beU) + '</p></section>' +
    '</div>' +
    '<section class="bf-card bf-section" aria-labelledby="h-tk"><h2 id="h-tk" class="bf-h2">Tickets al día: reales frente a necesarios</h2>' +
      '<p class="bf-sub">Verde: por encima de lo necesario para cubrir gastos. Rojo: por debajo.</p>' +
      '<div class="bf-chart" data-chart="tickets" data-h="290"></div>' +
      legendChips([['Reales', 'var(--brand)'], ['Necesarios (línea discontinua)', 'var(--choco)'], ['Por encima', 'var(--ok)'], ['Por debajo', 'var(--err)']]) +
    '</section>' +
    '<section class="bf-card bf-section" aria-labelledby="h-cal"><h2 id="h-cal" class="bf-h2">Calendario de rentabilidad</h2>' +
      '<p class="bf-sub">Beneficio antes de impuestos por mes. Del rojo (pérdida) al verde (beneficio). Es el mapa de la estacionalidad.</p>' +
      cal + '<p class="bf-hint">Noviembre y diciembre de 2026 todavía son previsiones y no se muestran aquí.</p></section>' +
    '<div class="bf-kpis" style="margin-top:16px">' + kpis + '</div>' +
    '<div class="bf-grid2">' +
      '<section class="bf-card" aria-labelledby="h-res"><h2 id="h-res" class="bf-h2">Reserva para el invierno</h2>' +
        '<p class="bf-sub">Pérdidas previstas de noviembre de 2026 a marzo de 2027.</p>' +
        '<p class="bf-kpi-val" style="font-size:24px">' + fE(loss) + '</p>' +
        '<div class="bf-prog" role="progressbar" aria-label="Caja frente a la reserva necesaria" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pctRes * 100) + '"><i style="width:' + (pctRes * 100).toFixed(1) + '%"></i></div>' +
        '<p class="bf-big-txt">' + esc(resTxt) + '</p></section>' +
      '<section class="bf-card" aria-labelledby="h-al"><h2 id="h-al" class="bf-h2">Alertas</h2>' + verdict + '</section>' +
    '</div>';
}

function paintProy() {

  var neg = pr.filter(function (r) { return r.bai < 0; }).length;
  var winter = pr.slice(0, 5), winterNet = winter.reduce(function (a, r) { return a + r.bai; }, 0);
  var kp = [
    kpi('bf-k1', 'Ingresos previstos a 12 meses', fE(A.rev), 'de noviembre de 2026 a octubre de 2027', '', null),

      '<div class="bf-chart" data-chart="proj" data-h="320"></div>' +
      srTable('Proyección mensual', ['Mes', 'Ingresos', 'Gastos', 'Beneficio', 'Caja'], pr.map(function (r) {
        return [BF_MONTHS[r.cm - 1] + ' ' + r.year, fE(r.rev), fE(r.gastos), fE(r.bai), fE(r.caja)];
      })) +
    '</section>' +
    '<div class="bf-grid2">' +
      '<section class="bf-card" aria-labelledby="h-tb"><h2 id="h-tb" class="bf-h2">Tabla mensual</h2>' +

        '<tbody>' + tbl + '</tbody></table></div></section>' +
      '<section class="bf-card" aria-labelledby="h-fr"><h2 id="h-fr" class="bf-h2">Lo que dice el escenario</h2>' +
        '<ul class="bf-phr" style="margin-top:12px">' + phr.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +

  if (t.id === 'bf-cmp') { ST.cmp.year = +t.value; ST.cmp.on = true; syncHash(); renderTab(); }
}
function onClick(e) {
  var outside = !!ST.picker && !e.target.closest('#bf-pop,[data-pick]');
  if (outside) ST.picker = null;
  var t = e.target.closest('[data-tab],[data-pick],[data-pick-year],[data-pick-month],[data-chip],[data-cmp-toggle],[data-period],[data-scen],[data-view],[data-exp],[data-reset],[data-sort],[data-tfilter],[data-cat-open],[data-add-expense],[data-form-open],[data-form-save],[data-form-cancel],[data-cust-edit],[data-cust-del],[data-part-edit],[data-part-save],[data-part-cancel],[data-part-del],[data-part-restore],[data-inline-edit],[data-inline-save],[data-inline-cancel],[data-reset-data],[data-drawer-close],#bf-theme');
  if (!t) { if (outside) renderTab(); return; }
  if (t.id === 'bf-theme') { toggleTheme(); return; }
  if (t.hasAttribute('data-drawer-close')) { closeDrawer(); return; }
  if (t.hasAttribute('data-tab')) { selectTab(t.getAttribute('data-tab')); return; }
  if (t.hasAttribute('data-pick')) {
    var which = t.getAttribute('data-pick');
    if (ST.picker && ST.picker.which === which) { ST.picker = null; ST.pickRet = which; ST.pickFocus = 'ret'; }
    else { ST.picker = { which: which, y: yOf(rangeOf(ST.period)[which === 'from' ? 0 : 1]) }; ST.pickFocus = 'sel'; }
    renderTab(); return;
  }
  if (t.hasAttribute('data-pick-year')) { ST.picker.y += +t.getAttribute('data-pick-year'); ST.pickFocus = 'sel'; renderTab(); return; }
  if (t.hasAttribute('data-pick-month')) { pickMonth(+t.getAttribute('data-pick-month')); return; }
  if (t.hasAttribute('data-chip')) {
    var id = t.getAttribute('data-chip'), rr = rangeOf(id);
    ST.period = id; ST.rangeOn = rr[0] !== rr[1]; ST.picker = null;
    dropStaleCmpYear();
    syncHash(); renderTab(); return;
  }
  if (t.hasAttribute('data-cmp-toggle')) {
    ST.cmp.on = !ST.cmp.on;
    if (ST.cmp.on && !ST.cmp.year) ST.cmp.year = cmpDefaultYear();
    syncHash(); renderTab(); return;
  }
  if (t.hasAttribute('data-scen')) { ST.scen = t.getAttribute('data-scen'); ST.sim = copyScen(ST.scen); recalc(); renderTab(); return; }
  if (t.hasAttribute('data-view')) { ST.gView = t.getAttribute('data-view'); renderTab(); return; }
  if (t.hasAttribute('data-reset')) { ST.sim = copyScen(ST.scen); recalc(); renderTab(); return; }
  if (t.hasAttribute('data-sort')) {
    var key = t.getAttribute('data-sort');
    ST.prodSort = ST.prodSort.key === key ? { key: key, dir: -ST.prodSort.dir } : { key: key, dir: key === 'name' ? 1 : -1 };
    renderTab(); return;
  }
  if (t.hasAttribute('data-tfilter')) { ST.tfilter = t.getAttribute('data-tfilter'); renderTab(); return; }
  if (t.hasAttribute('data-cat-open')) { openDrawer({ cat: t.getAttribute('data-cat-open'), mode: 'detail' }, t); return; }
  if (t.hasAttribute('data-add-expense')) { openDrawer({ cat: 'otros', mode: 'form', form: { cat: 'otros' } }, t); return; }
  if (t.hasAttribute('data-form-open')) { formOpen(t.getAttribute('data-form-open')); return; }
  if (t.hasAttribute('data-form-save')) { formSave(); return; }
  if (t.hasAttribute('data-form-cancel')) { ST.drawer = { cat: (ST.drawer && ST.drawer.cat) || 'otros', mode: 'detail' }; renderDrawer(true); return; }
  if (t.hasAttribute('data-cust-edit')) {
    var cu = BF_DATA.customs.filter(function (x) { return x.id === t.getAttribute('data-cust-edit'); })[0];
    if (cu) formOpen(cu.cat, cu);
    return;
  }
  if (t.hasAttribute('data-cust-del')) { customDelete(t.getAttribute('data-cust-del'), t.getAttribute('data-cust-label')); return; }
  if (t.hasAttribute('data-part-edit')) { ST.partEdit = t.getAttribute('data-part-edit'); renderDrawer(false); return; }
  if (t.hasAttribute('data-part-save')) { partSave(); return; }
  if (t.hasAttribute('data-part-cancel')) { ST.partEdit = null; renderDrawer(true); return; }
  if (t.hasAttribute('data-part-del')) { partDelete(t.getAttribute('data-part-del'), t.getAttribute('data-part-label')); return; }
  if (t.hasAttribute('data-part-restore')) { partRestore(t.getAttribute('data-part-restore')); return; }
  if (t.hasAttribute('data-inline-edit')) { ST.inline = t.getAttribute('data-inline-edit'); ST.inlineErr = ''; renderTab(); return; }
  if (t.hasAttribute('data-inline-save')) { inlineSave(t.getAttribute('data-inline-save')); return; }
  if (t.hasAttribute('data-inline-cancel')) { ST.inline = null; ST.inlineErr = ''; renderTab(); return; }
  if (t.hasAttribute('data-reset-data')) { resetData(); return; }
  if (t.hasAttribute('data-exp')) {
    var grp = t.getAttribute('data-exp'), open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
    t.querySelector('span').textContent = open ? '▾' : '▸';
    document.querySelectorAll('[data-grp="' + grp + '"]').forEach(function (r) { r.hidden = !open; });
  }
}

// ---------- Vistas, eventos y arranque ----------
function viewFor(tab) {
  if (tab === 'gastos') return viewGastos();
  if (tab === 'productos') return viewProductos();
  if (tab === 'tesoreria') return viewTesoreria();
  if (tab === 'sostenibilidad') return viewSost();
  if (tab === 'proyeccion') return viewProy();
  return viewResumen();
}
function renderTab() {
  var m = $('bf-main');
  m.innerHTML = viewFor(ST.tab);
  m.setAttribute('aria-labelledby', 'tab-' + ST.tab);
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    var on = b.getAttribute('data-tab') === ST.tab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
  });
  afterPickRender();
  if (ST.drawer) renderDrawer(false);
  if (ST.tab === 'proyeccion') paintProy(); else hydrate();
  if (ST.inline) { var inl = $('bf-inl'); if (inl) { inl.focus(); inl.select(); } }
}
function shell() {
  return '<div class="bf-wrap">' +
    '<header class="bf-top">' +
      '<div class="bf-logo"><span class="bf-logo-mark">' + ICON_LOGO + '</span><h1>Bola de Nieve</h1><span class="bf-tag">Finanzas</span></div>' +
      '<div class="bf-actions"><span>Importes sin IVA</span>' +
        '<button id="bf-theme" class="bf-btn bf-theme" type="button"></button>' +
        '<a class="bf-btn" href="demo-heladeria.html">← Volver a la tienda</a></div>' +
    '</header>' +
    '<p class="bf-demo">Demo con datos ficticios · creada por <a href="index.html">Sundan Studio</a></p>' +
    '<nav aria-label="Secciones"><div class="bf-tabs" role="tablist">' + TABS.map(function (t) {
      return '<button type="button" role="tab" id="tab-' + t[0] + '" class="bf-tab" data-tab="' + t[0] + '" aria-controls="bf-main" data-umami-event="bf-tab-' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div></nav>' +
    '<main id="bf-main" class="bf-main" role="tabpanel" tabindex="-1"></main>' +
    '<div id="bf-drawer-root" class="bf-drawer-root" hidden><div class="bf-scrim" data-drawer-close="1"></div><aside id="bf-drawer" class="bf-drawer" role="dialog" aria-modal="true" aria-labelledby="bf-dr-title"><div id="bf-dr-body"></div></aside></div>' +
  '</div>';
}
function isDark() {
  var a = document.documentElement.getAttribute('data-theme');
  if (a) return a === 'dark';
  return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function themeIcon() {
  var b = $('bf-theme');
  if (!b) return;
  var dark = isDark();
  b.setAttribute('aria-label', dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;
}
function toggleTheme() {
  var t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('bf-theme', t); } catch (e) { /* sin almacenamiento: el tema solo dura esta visita */ }
  themeIcon();
  hydrate();
}
function applyTheme() {
  try {
    var t = localStorage.getItem('bf-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* sin almacenamiento */ }
}
function onInput(e) {
  var t = e.target;
  if (!t.hasAttribute || !t.hasAttribute('data-sim')) return;
  var key = t.getAttribute('data-sim');
  if (key === 'extraDep') ST.sim.extraDep = t.checked;
  else {
    ST.sim[key] = +t.value / 100;
    var lbl = $('lbl-' + key);
    if (lbl) lbl.textContent = sgn(+t.value);
    t.setAttribute('aria-valuetext', sgn(+t.value));
  }
  recalc();
  paintProy();
}
function onTabKey(e) {
  var t = e.target;
  if (!t.hasAttribute || !t.hasAttribute('data-tab')) return;
  var tabs = [].slice.call(document.querySelectorAll('[data-tab]')), i = tabs.indexOf(t), j = -1;
  if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
  else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') j = 0;
  else if (e.key === 'End') j = tabs.length - 1;
  if (j < 0) return;
  e.preventDefault();
  tabs[j].focus();
  selectTab(tabs[j].getAttribute('data-tab'));
}
function init() {
  applyTheme();
  dataLoad();
  var app = $('app');
  app.innerHTML = shell();
  ST.sim = copyScen('base');
  recalc();
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('keydown', onTabKey);
  app.addEventListener('keydown', onEditKey);
  app.addEventListener('change', onChange);
  document.addEventListener('keydown', onDocKey);
  themeIcon();
  window.addEventListener('hashchange', function () { setFromHash(); syncHash(); renderTab(); });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (ST.tab === 'proyeccion') paintProy(); else hydrate(); }, 150); });
  setFromHash();
  syncHash();
  renderTab();
}
init();
/* UI END */
</script>
