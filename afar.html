// ═══════════════════════════════════════════════════════════
//  SFX  —  Web Audio API (generado por Haiku)
// ═══════════════════════════════════════════════════════════
const SFX=(function(){
  let acx=null,failed=false;
  function getCtx(){
    if(failed)return null;
    if(!acx){try{acx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){failed=true;return null;}}
    if(acx.state==='suspended')acx.resume();
    return acx;
  }
  function tone(ac,type,f0,f1,dur,vol,delay){
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(ac,dur){
    const len=Math.max(1,Math.floor(ac.sampleRate*dur)),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const s=ac.createBufferSource();s.buffer=buf;return s;
  }
  function playJump(){const ac=getCtx();if(!ac)return;tone(ac,'sine',180,520,0.13,0.3,0);}
  function playLand(){const ac=getCtx();if(!ac)return;tone(ac,'sine',90,90,0.06,0.6,0);}
  function playThunder(){
    const ac=getCtx();if(!ac)return;const t=ac.currentTime;
    const src=noise(ac,2.0),bp=ac.createBiquadFilter(),g=ac.createGain();
    bp.type='bandpass';bp.frequency.value=120;bp.Q.value=0.8;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.15);
    g.gain.setValueAtTime(0.9,t+0.55);g.gain.exponentialRampToValueAtTime(0.0001,t+1.95);
    src.connect(bp).connect(g).connect(ac.destination);src.start(t);src.stop(t+2.0);
  }
  function playLightningCrack(){
    const ac=getCtx();if(!ac)return;const t=ac.currentTime;
    const src=noise(ac,0.35),g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1.0,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    src.connect(g).connect(ac.destination);src.start(t);src.stop(t+0.35);
    tone(ac,'sawtooth',1800,120,0.35,0.25,0);
  }
  function playWin(){const ac=getCtx();if(!ac)return;[523,659,784].forEach((f,i)=>tone(ac,'triangle',f,f,0.14,0.3,i*0.14));}
  function playDie(){const ac=getCtx();if(!ac)return;tone(ac,'sine',220,60,0.35,0.5,0);}
  return{playJump,playLand,playThunder,playLightningCrack,playWin,playDie};
})();

// ═══════════════════════════════════════════════════════════
//  drawAfar  —  personaje (generado por Haiku)
// ═══════════════════════════════════════════════════════════
function drawAfar(ctx,x,y,facing,animState,animTime,swingTheta){
  var suit='#efe3c8',gold='#e9b42f',limbC='#c8bfa0',ink='#5a4e38';
  var HIP=-14,TORSO=16,UP=7,LO=7,SHX=5,HIPX=2.5,PI=Math.PI;
  function tip(px,py,ang,len){return[px+Math.sin(ang)*len,py+Math.cos(ang)*len];}
  function limb(px,py,a1,a2){
    var p1=tip(px,py,a1,UP),p2=tip(p1[0],p1[1],a2,LO);
    ctx.strokeStyle=limbC;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
    ctx.fillStyle=limbC;ctx.beginPath();ctx.arc(p2[0],p2[1],1.8,0,PI*2);ctx.fill();
  }
  function figure(p){
    var lift=p.lift||0,sy=p.sy||1,torsoBot=HIP-lift,torsoTop=torsoBot-TORSO*sy;
    var shY=torsoTop+3,headY=torsoTop-5,l=-5,r=5,t=torsoTop,b=torsoBot,k=3;
    limb(-HIPX,HIP,p.legB[0],p.legB[1]);limb(HIPX,HIP,p.legA[0],p.legA[1]);
    limb(-SHX,shY,p.armB[0],p.armB[1]);
    ctx.beginPath();ctx.moveTo(l+k,t);ctx.lineTo(r-k,t);ctx.arcTo(r,t,r,t+k,k);
    ctx.lineTo(r,b-k);ctx.arcTo(r,b,r-k,b,k);ctx.lineTo(l+k,b);ctx.arcTo(l,b,l,b-k,k);
    ctx.lineTo(l,t+k);ctx.arcTo(l,t,l+k,t,k);ctx.closePath();
    ctx.fillStyle=suit;ctx.fill();ctx.strokeStyle=limbC;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=gold;ctx.fillRect(l,b-3,10,3);
    ctx.beginPath();ctx.arc(0,headY,7,0,PI*2);ctx.fillStyle=suit;ctx.fill();
    ctx.strokeStyle=limbC;ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,headY,6.5,PI*1.15,PI*1.85);ctx.stroke();
    ctx.fillStyle=ink;ctx.beginPath();ctx.arc(2.5,headY+0.5,1,0,PI*2);ctx.fill();
    limb(SHX,shY,p.armA[0],p.armA[1]);
  }
  var s=animState,p;ctx.save();
  if(s==='swing'){
    ctx.translate(x,y);ctx.scale(facing,1);ctx.rotate(swingTheta);ctx.translate(0,41);
    // swingPose: 0=encogido (rodillas al pecho), 0.5=neutro, 1=estirado (piernas adelante)
    var sp=typeof P!=='undefined'&&P.swingPose!=null?P.swingPose:0.5;
    var om=typeof P!=='undefined'?Math.abs(P.swingOmega||0):0;
    var intens=Math.min(1,om*0.8);
    var t=(sp*2-1)*intens; // -1=tuck, 0=neutro, 1=stretch
    var tf=Math.max(0,-t), sf=Math.max(0,t);
    // piernas: neutro upper=0.12 lower=0.07 | tuck upper=-0.72 lower=1.3 | stretch upper=0.42 lower=0.04
    var legU=0.12+tf*(-0.72-0.12)+sf*(0.42-0.12);
    var legL=0.07+tf*(1.3-0.07)+sf*(0.04-0.07);
    // leve lift en tuck (cuerpo se recoge), leve extensión en stretch
    var lft=tf*5-sf*1.5;
    // inclinación de espalda en tuck: cabeza hacia atrás ~15°
    if(tf>0) ctx.rotate(-tf*0.26);
    figure({legA:[legU,legL],legB:[legU-0.04,legL-0.03],
            armA:[PI-0.12,PI-0.05],armB:[-(PI-0.12),-(PI-0.05)],
            lift:lft});
  }else if(s==='trick'){
    ctx.translate(x,y-20);ctx.scale(facing,1);ctx.rotate(animTime*12);
    ctx.beginPath();ctx.arc(0,0,12,0,PI*2);ctx.fillStyle=suit;ctx.fill();
    ctx.strokeStyle=limbC;ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,10,PI*0.9,PI*1.4);ctx.stroke();
    ctx.fillStyle=limbC;ctx.beginPath();ctx.arc(-5,5,3.5,0,PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(5,5,3.5,0,PI*2);ctx.fill();
    ctx.fillStyle=suit;ctx.strokeStyle=limbC;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,-6,4,0,PI*2);ctx.fill();ctx.stroke();
  }else{
    ctx.translate(x,y);ctx.scale(facing,1);
    if(s==='walk'){
      var fr=Math.floor(animTime*8)%4,sg=fr===0?1:(fr===2?-1:0),a=0.384,bv=0.314;
      p=sg?{legA:[a*sg,a*sg*0.5],legB:[-a*sg,-a*sg*0.5],armA:[-bv*sg,-bv*sg+0.15],armB:[bv*sg,bv*sg+0.15]}
           :{legA:[0,0],legB:[0,0],armA:[0,0.15],armB:[0,0.15]};
    }else if(s==='jump'){
      p={legA:[1.0,0.2],legB:[0.9,0.1],armA:[PI-0.52,PI-0.5],armB:[-(PI-0.52),-(PI-0.5)],sy:0.9};
    }else if(s==='fall'){
      p={legA:[-0.2,-0.3],legB:[-0.25,-0.35],armA:[1.22,1.3],armB:[-1.22,-1.3],sy:1.08};
    }else{
      var b=Math.sin(animTime*2.2);
      p={legA:[b*0.07,b*0.03],legB:[-b*0.07,-b*0.03],armA:[0.1+b*0.1,0.22+b*0.06],armB:[-(0.1+b*0.1),-(0.22+b*0.06)],lift:Math.abs(b)*3+0.5};
    }
    figure(p);
  }
  ctx.restore();
}

function initPlayer(){
  P={x:lv.spawnX,y:lv.spawnY-2,vx:0,vy:0,
     onGround:false,facing:1,state:'idle',animTime:0,
     grabbed:null,swingTheta:0,swingOmega:0,
     swingPose:0.5,
     deathAnim:0,trickAnim:0};

//  INPUT

const KEY={};
const TOUCH={left:false,right:false,up:false};
let jumpPressed=false,lastJumpState=false,lastLeft=false,lastRight=false;

function toggleMute(){
  musicMuted=!musicMuted;
  if(musicMuted)MUSIC.stop();else MUSIC.start();
}
addEventListener('keydown',e=>{
  KEY[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{KEY[e.code]=false;});
addEventListener('touchstart',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const nx=t.clientX/window.innerWidth;
    if(nx<0.33)TOUCH.left=true;else if(nx>0.67)TOUCH.right=true;else TOUCH.up=true;
  });
},{passive:false});
addEventListener('touchend',e=>{
  e.preventDefault();TOUCH.left=TOUCH.right=TOUCH.up=false;
  Array.from(e.touches).forEach(t=>{
    const nx=t.clientX/window.innerWidth;
    if(nx<0.33)TOUCH.left=true;else if(nx>0.67)TOUCH.right=true;else TOUCH.up=true;
  });
},{passive:false});

function wantsLeft(){return KEY.ArrowLeft||KEY.KeyA||TOUCH.left;}
function wantsRight(){return KEY.ArrowRight||KEY.KeyD||TOUCH.right;}
function wantsJump(){return KEY.ArrowUp||KEY.Space||KEY.KeyW||TOUCH.up;}

// ═══════════════════════════════════════════════════════════
//  FÍSICA
// ═══════════════════════════════════════════════════════════
function movingX(pl){
  if(!pl.moving)return pl.x;
  return pl.x+Math.sin(gameNow*pl.mspd)*pl.mx;
}

function updatePlayer(dt){
  if(P.grabbed){updateSwing(dt);return;}
  if(P.deathAnim>0){P.deathAnim-=dt;return;}

  const left=wantsLeft(),right=wantsRight();
  if(left&&!right){P.vx=-WALK_SPD;if(P.onGround)P.facing=-1;}
  else if(right&&!left){P.vx=WALK_SPD;if(P.onGround)P.facing=1;}
  else P.vx*=Math.pow(0.0001,dt);

  if(jumpPressed&&P.onGround){
    P.vy=JUMP_VEL;P.onGround=false;SFX.playJump();
  }else if(jumpPressed&&!P.onGround){
    tryGrab();
  }

  P.vy+=GRAVITY*dt;
  const prevY=P.y;
  P.x+=P.vx*dt;
  P.y+=P.vy*dt;

  const wasOnGround=P.onGround;
  P.onGround=false;

  platforms.forEach(pl=>{
    const plx=movingX(pl);
    if(P.x+PW/2<=plx||P.x-PW/2>=plx+pl.w)return;
    if(P.vy>=0&&prevY<=pl.y&&P.y>=pl.y){
      P.y=pl.y;P.vy=0;P.onGround=true;
      if(!wasOnGround)SFX.playLand();
    }
    if(P.vy<0&&(prevY-PH)>=(pl.y+pl.h)&&(P.y-PH)<(pl.y+pl.h)){
      P.y=pl.y+pl.h+PH;P.vy=0;
    }
  });

  if(P.x<PW/2){P.x=PW/2;P.vx=0;}
  if(P.y>VH+100)die();

  if(P.onGround&&lv.goal&&P.x>lv.goal.x&&P.y<=lv.goal.y+30&&gState==='playing'){
    gState='levelEnd';SFX.playWin();
    if(levelIdx+1>getSaved())setSaved(levelIdx+1);
  }

  if(P.trickAnim>0){P.state='trick';P.trickAnim-=dt;}
  else if(!P.onGround&&P.vy<-100)P.state='jump';
  else if(!P.onGround)P.state='fall';
  else if(Math.abs(P.vx)>10)P.state='walk';
  else P.state='idle';
  P.animTime+=dt;
}

function updateSwing(dt){
  const tr=P.grabbed;
  const lean=wantsRight()?1:wantsLeft()?-1:0;
  if(lean!==0){
    if(Math.sign(lean)===Math.sign(P.swingOmega)) P.swingOmega+=lean*2.2*dt;  // pump
    else P.swingOmega*=Math.pow(0.04,dt);  // freno: decaimiento rápido al presionar opuesto
  }
  const alpha=-(GRAVITY/tr.L)*Math.sin(P.swingTheta)-DAMP*P.swingOmega;
  P.swingOmega+=alpha*dt;P.swingTheta+=P.swingOmega*dt;
  P.x=tr.px+Math.sin(P.swingTheta)*tr.L;
  P.y=tr.py+Math.cos(P.swingTheta)*tr.L;
  P.state='swing';P.animTime+=dt;
  // pose: depende de la tecla presionada
  var poseTarget=0.5; // neutral sin input
  if(lean>0) poseTarget=1;      // derecha → stretch
  else if(lean<0) poseTarget=0; // izquierda → tuck
  P.swingPose+=(poseTarget-P.swingPose)*Math.min(1,8*dt);
  if(jumpPressed){
    P.vx=Math.cos(P.swingTheta)*tr.L*P.swingOmega;
    P.vy=JUMP_VEL*0.5; // 50% del salto normal desde el suelo
    if(Math.abs(P.swingTheta)>Math.PI/3)P.trickAnim=0.55;
    P.grabbed=null;
  }
  if(P.y>VH+100)die();
}

function tryGrab(){
  let best=null,bd=GRAB_R*GRAB_R;
  trapezes.forEach(tr=>{
    const bx=tr.px+Math.sin(tr.theta)*tr.L,by=tr.py+Math.cos(tr.theta)*tr.L;
    const d2=(P.x-bx)*(P.x-bx)+(P.y-by)*(P.y-by);
    if(d2<bd){bd=d2;best=tr;}
  });
  if(best){
    P.grabbed=best;
    P.swingTheta=Math.atan2(P.x-best.px,P.y-best.py);
    P.swingOmega=best.omega*0.4;
    P.vy=0;P.vx=0;
  }
}

function resetTrapezes(){
  LEVELS[levelIdx].trapezes.forEach((orig,i)=>{
    trapezes[i].theta=orig.theta;
    trapezes[i].omega=orig.theta>0?-0.65:0.65;
  });
}

function die(){
  if(P.deathAnim>0||gState!=='playing')return;
  deathCount++;SFX.playDie();P.grabbed=null;P.deathAnim=1.1;
  setTimeout(()=>{if(gState==='playing'){resetTrapezes();initPlayer();}},1100);
}

function updateTrapezes(dt){
  trapezes.forEach(tr=>{
    if(P.grabbed&&P.grabbed.id===tr.id){
      // Sincronizar con el ángulo real del jugador (evita congelamiento visual)
      tr.theta=P.swingTheta;tr.omega=P.swingOmega;
      return;
    }
    const alpha=-(GRAVITY/tr.L)*Math.sin(tr.theta)-DAMP*tr.omega;
    tr.omega+=alpha*dt;tr.theta+=tr.omega*dt;
  });
}

function updateCamera(){
  const lEdge=camX+VW*0.3,rEdge=camX+VW*0.65;
  if(P.x<lEdge)camX=P.x-VW*0.3;
  if(P.x>rEdge)camX=P.x-VW*0.65;
  camX=Math.max(0,Math.min((lv.worldW||VW)-VW,camX));
}

function updateClouds(dt){
  if(!clouds)return;
  clouds.forEach(cl=>{
    cl.x-=dt*18;
    if(cl.x<-200)cl.x=(lv?lv.worldW:1600)+100+Math.random()*200;
  });
}

// ═══════════════════════════════════════════════════════════
//  RAYO — funciones compartidas
// ═══════════════════════════════════════════════════════════
function boltA(u){return u<.12?1:u<.22?.2:u<.36?.95:Math.pow(Math.max(0,1-(u-.36)/.64),1.5);}
function mkBolt(x0,y0,x1,y1,d){
  var pts=[[x0,y0]];
  (function sub(ax,ay,bx,by,dd,o){
    if(dd===0){pts.push([bx,by]);return;}
    var mx=(ax+bx)/2+(Math.random()-.5)*o,my=(ay+by)/2+(Math.random()-.5)*o*.3;
    sub(ax,ay,mx,my,dd-1,o/2);sub(mx,my,bx,by,dd-1,o/2);
  })(x0,y0,x1,y1,d,Math.hypot(x1-x0,y1-y0)*.22);
  return pts;
}
function drawGameBolts(ctx){
  if(!gameBolts.length)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  gameBolts=gameBolts.filter(b=>{
    const u=(gameNow-b.t0)/b.dur;if(u>=1)return false;
    b.a=boltA(u);
    [[8,.08,'#f2d9a0'],[3.5,.3,'#f6c453'],[1.5,1,'#fff7e6']].forEach(L=>{
      ctx.strokeStyle=L[2];ctx.lineJoin='round';ctx.lineCap='round';
      [b.pts,...b.br].forEach((p,k)=>{
        ctx.lineWidth=L[0]*(k?.5:1);ctx.globalAlpha=Math.min(1,L[1]*b.a);
        ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
        for(let j=1;j<p.length;j++)ctx.lineTo(p[j][0],p[j][1]);ctx.stroke();
      });
    });
    ctx.globalAlpha=1;return true;
  });
  ctx.globalCompositeOperation='source-over';ctx.restore();
}

// ═══════════════════════════════════════════════════════════
//  TORMENTA
// ═══════════════════════════════════════════════════════════
function updateStorm(){
  if(!lv||!lv.lightning||lv.storm===0)return;
  if(gameNow*1000>nextLightning){
    const lx=camX+VW*0.15+Math.random()*(VW*0.7);
    boltWarning={x:lx,start:gameNow*1000,dur:lv.lightning.warnTime};
    nextLightning=gameNow*1000+lv.lightning.warnTime+lv.lightning.interval*(0.7+Math.random()*0.6);
    SFX.playThunder();
  }
  if(boltWarning&&gameNow*1000>=boltWarning.start+boltWarning.dur){
    // Rayo visual: trazo dentado desde la cima hasta el suelo
    const lx=boltWarning.x;
    const pts=mkBolt(lx,0,lx+(Math.random()-.5)*12,VH,6);
    const br=[];
    for(let k=0;k<2;k++){
      const p=pts[Math.floor(pts.length*(0.3+Math.random()*0.4))];
      br.push(mkBolt(p[0],p[1],p[0]+(Math.random()-.5)*VW*.12,p[1]+VH*.09,3));
    }
    gameBolts.push({pts,br,t0:gameNow,dur:0.56,a:1});
    flashAlpha=1;SFX.playLightningCrack();
    if(gState==='playing'&&Math.abs((P.x-camX)-boltWarning.x)<52)die();
    boltWarning=null;
  }
  if(flashAlpha>0)flashAlpha=Math.max(0,flashAlpha-0.03);
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function drawBackground(ctx){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,lv.bgTop);gr.addColorStop(1,lv.bgBot);
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);

  if(lv.storm===0&&!reduce){
    for(let i=0;i<48;i++){
      const sx=(i*137.5)%VW,sy=(i*61.8)%160;
      ctx.globalAlpha=0.15+(Math.sin(gameNow*0.9+i)*0.5+0.5)*0.5;
      ctx.fillStyle='#efe3c8';ctx.beginPath();ctx.arc(sx,sy,0.7,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  const alpha=lv.storm===0?0.3:lv.storm===1?0.65:0.82;
  const col0=lv.storm===0?'60,25,60':lv.storm===1?'20,8,28':'10,3,15';
  clouds.forEach(cl=>{
    const sx=cl.x-camX*0.4;
    if(sx<-cl.r*2||sx>VW+cl.r*2)return;
    const gr2=ctx.createRadialGradient(sx,cl.y,0,sx,cl.y,cl.r);
    gr2.addColorStop(0,`rgba(${col0},${alpha})`);gr2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr2;
    ctx.beginPath();ctx.ellipse(sx,cl.y,cl.r*1.6,cl.r*0.55,0,0,TAU);ctx.fill();
  });
}

function drawPlatforms(ctx){
  platforms.forEach(pl=>{
    const px=movingX(pl)-camX;
    if(px+pl.w<-20||px>VW+20)return;
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(px+5,pl.y+6,pl.w,pl.h);
    const gr=ctx.createLinearGradient(px,pl.y,px,pl.y+pl.h);
    gr.addColorStop(0,'#c1121f');gr.addColorStop(1,'#7a0a12');
    ctx.fillStyle=gr;ctx.fillRect(px,pl.y,pl.w,pl.h);
    ctx.fillStyle='rgba(239,227,200,0.1)';ctx.fillRect(px,pl.y,pl.w,3);
    if(pl.h>30){
      ctx.save();ctx.beginPath();ctx.rect(px,pl.y,pl.w,pl.h);ctx.clip();
      ctx.fillStyle='rgba(170,10,25,0.3)';
      for(let i=0;i<Math.ceil(pl.w/18)+1;i++)ctx.fillRect(px+i*32,pl.y,14,pl.h);
      ctx.restore();
    }
  });
}

function drawTrapezes(ctx){
  trapezes.forEach(tr=>{
    // Si el jugador tiene este trapecio, usar su ángulo real (no el congelado)
    const drawTheta=(P.grabbed&&P.grabbed.id===tr.id)?P.swingTheta:tr.theta;
    const pivX=tr.px-camX,bx=pivX+Math.sin(drawTheta)*tr.L,by=tr.py+Math.cos(drawTheta)*tr.L;
    if(bx<-80||bx>VW+80)return;
    ctx.save();
    ctx.strokeStyle='rgba(239,227,200,0.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pivX,tr.py);ctx.lineTo(bx,by);ctx.stroke();
    ctx.strokeStyle='#e9b42f';ctx.lineWidth=4.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx-16,by);ctx.lineTo(bx+16,by);ctx.stroke();
    if(!reduce){ctx.shadowColor='#e9b42f';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;}
    ctx.fillStyle='rgba(239,227,200,0.2)';ctx.beginPath();ctx.arc(pivX,tr.py,5,0,TAU);ctx.fill();
    ctx.restore();
  });
}

function drawGoal(ctx){
  if(!lv.goal)return;
  const gx=lv.goal.x-camX,gy=lv.goal.y;
  if(gx<-40||gx>VW+40)return;
  ctx.strokeStyle='#efe3c8';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy-54);ctx.stroke();
  ctx.fillStyle='#e9b42f';
  ctx.beginPath();ctx.moveTo(gx,gy-54);ctx.lineTo(gx+32,gy-44);ctx.lineTo(gx,gy-34);ctx.fill();
  if(!reduce){
    ctx.save();ctx.globalAlpha=0.3+Math.sin(gameNow*3)*0.22;
    ctx.fillStyle='#e9b42f';ctx.beginPath();ctx.arc(gx,gy-44,24,0,TAU);ctx.fill();
    ctx.restore();
  }
}

function drawBoltWarning(ctx){
  if(!boltWarning)return;
  const lx=boltWarning.x;
  const prog=Math.min(1,(gameNow*1000-boltWarning.start)/boltWarning.dur);
  ctx.save();
  // Parpadeo irregular: dos senos multiplicados crean un patrón no uniforme
  const flick=(Math.sin(gameNow*7.3)*0.5+0.5)*(Math.sin(gameNow*3.1)*0.5+0.5);
  if(flick>(0.85-prog*0.72)){
    // Regenerar trazo del rayo cada cierto intervalo
    if(!boltWarning._pts||gameNow>boltWarning._nextPts){
      boltWarning._pts=mkBolt(lx,0,lx+(Math.random()-.5)*20,VH,4);
      boltWarning._nextPts=gameNow+0.08+Math.random()*0.14;
    }
    const a=(0.03+prog*.20)*(0.4+Math.random()*.6);
    ctx.globalAlpha=a;
    ctx.strokeStyle='#f8e878';ctx.lineWidth=1.2;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();
    boltWarning._pts.forEach((p,i)=>{i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});
    ctx.stroke();
    // Resplandor en el suelo
    ctx.globalAlpha=Math.min(1,a*2);
    const gr=ctx.createRadialGradient(lx,VH,0,lx,VH,55);
    gr.addColorStop(0,'rgba(248,220,80,.5)');gr.addColorStop(1,'rgba(248,220,80,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(lx,VH,55,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function drawMuteBtn(ctx){
  const bx=VW-30, by=30, r=16;
  ctx.save();
  ctx.globalAlpha=0.65;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.arc(bx,by,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(239,227,200,0.5)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='rgba(239,227,200,0.9)';ctx.lineWidth=1.5;ctx.strokeStyle='rgba(239,227,200,0.9)';
  // Cuerpo del altavoz
  ctx.beginPath();ctx.moveTo(bx-7,by-5);ctx.lineTo(bx-3,by-5);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+2,by+9);ctx.lineTo(bx-3,by+5);ctx.lineTo(bx-7,by+5);ctx.closePath();ctx.fill();
  if(!musicMuted){
    // Ondas de sonido
    ctx.beginPath();ctx.arc(bx+2,by,8,Math.PI*0.25,Math.PI*1.75);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+2,by,13,Math.PI*0.3,Math.PI*1.7);ctx.stroke();
  } else {
    // X de mute
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx+5,by-6);ctx.lineTo(bx+11,by+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+11,by-6);ctx.lineTo(bx+5,by+6);ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(ctx){
  ctx.font='500 13px "Instrument Sans",Arial,sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(239,227,200,0.5)';ctx.fillText(`Nivel ${levelIdx+1}`,14,14);
  if(deathCount>0){ctx.textAlign='right';ctx.fillText(`✕ ${deathCount}`,VW-60,14);}
  drawMuteBtn(ctx);
  if(levelIdx===0&&(gameNow*1000-levelStartTime)<6500){
    const a=Math.min(1,(6500-(gameNow*1000-levelStartTime))/1500);
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.fillStyle='rgba(239,227,200,0.6)';ctx.font='13px "Instrument Sans",Arial,sans-serif';
    ctx.fillText('← → moverse  ·  ↑/espacio = saltar  ·  ↑/espacio en el aire = agarrar trapecio  ·  M = música',VW/2,VH-28);
    ctx.restore();
  }
  ctx.textBaseline='alphabetic';
}

function render(ctx){
  drawBackground(ctx);
  drawPlatforms(ctx);
  drawTrapezes(ctx);
  drawGoal(ctx);
  if(gState==='playing'||gState==='levelEnd'){
    if(P.deathAnim<=0||Math.floor(P.deathAnim*8)%2===0){
      drawAfar(ctx,P.x-camX,P.y,P.facing,P.state,P.animTime,P.swingTheta);
    }
  }
  drawBoltWarning(ctx);
  drawGameBolts(ctx);
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(239,227,200,${flashAlpha*0.6})`;
    ctx.fillRect(0,0,VW,VH);
  }
  drawHUD(ctx);
}

// ═══════════════════════════════════════════════════════════
//  PANTALLAS
// ═══════════════════════════════════════════════════════════
function drawTitle(ctx){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,'#1a0a1e');gr.addColorStop(1,'#0e040b');
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
  clouds.forEach(cl=>{
    const sx=cl.x-camX*0.4;
    if(sx<-cl.r*2||sx>VW+cl.r*2)return;
    const gr2=ctx.createRadialGradient(sx,cl.y,0,sx,cl.y,cl.r);
    gr2.addColorStop(0,'rgba(60,25,60,0.3)');gr2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr2;ctx.beginPath();ctx.ellipse(sx,cl.y,cl.r*1.6,cl.r*0.55,0,0,TAU);ctx.fill();
  });
  if(!reduce){
    ctx.save();ctx.translate(VW/2,VH/2);
    for(let i=0;i<16;i++){
      const a=i*TAU/16+gameNow*0.09;
      ctx.strokeStyle=i%2?'rgba(193,18,31,0.05)':'rgba(239,227,200,0.025)';
      ctx.lineWidth=VH;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*900,Math.sin(a)*900);ctx.stroke();
    }
    ctx.restore();
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='500 70px Gloock,Georgia,serif';
  ctx.fillStyle='#efe3c8';ctx.fillText('Afar',VW/2,VH*0.36);
  ctx.font='400 20px "Instrument Sans",Arial,sans-serif';
  ctx.fillStyle='#e9b42f';ctx.fillText('el trapecista',VW/2,VH*0.36+46);
  const saved=getSaved();
  const pulse=Math.sin(gameNow*4)*0.18+0.82;
  ctx.globalAlpha=pulse;
  ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='#efe3c8';
  ctx.fillText(saved>0?'Presiona espacio / toca para jugar':'Presiona espacio / toca para empezar',VW/2,VH*0.68);
  ctx.globalAlpha=1;
  if(saved>0){
    ctx.font='500 13px "Instrument Sans",Arial,sans-serif';
    ctx.fillStyle='rgba(239,227,200,0.45)';ctx.fillText('← → para elegir nivel',VW/2,VH*0.68+22);
    ctx.fillStyle='#e9b42f';ctx.fillText(`${LEVELS[levelIdx].act}: ${LEVELS[levelIdx].title}`,VW/2,VH*0.68+44);
  }
  ctx.font='400 12px "Instrument Sans",Arial,sans-serif';
  ctx.fillStyle='rgba(239,227,200,0.3)';
  LEVELS[levelIdx].story.split('\n').forEach((line,i)=>ctx.fillText(line,VW/2,VH*0.82+i*17));
  ctx.textBaseline='alphabetic';
}

function drawLevelEnd(ctx){
  ctx.fillStyle='rgba(14,6,15,0.72)';ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='500 42px Gloock,Georgia,serif';ctx.fillStyle='#e9b42f';
  ctx.fillText(`Fin del ${lv.act}`,VW/2,VH*0.26);
  if(levelIdx<2){
    const nx=LEVELS[levelIdx+1];
    ctx.font='500 18px Gloock,Georgia,serif';ctx.fillStyle='rgba(239,227,200,0.75)';
    ctx.fillText(`${nx.act}: ${nx.title}`,VW/2,VH*0.46);
    ctx.font='400 12px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='rgba(239,227,200,0.42)';
    nx.story.split('\n').forEach((line,i)=>ctx.fillText(line,VW/2,VH*0.46+26+i*17));
    ctx.globalAlpha=Math.sin(gameNow*4)*0.18+0.82;
    ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='#efe3c8';
    ctx.fillText('Espacio / toca para continuar',VW/2,VH*0.82);ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';
}

function drawEnding(ctx){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,'#0d0410');gr.addColorStop(1,'#060108');
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
  if(!reduce){
    for(let i=0;i<22;i++){
      const cx=((i*73.9+gameNow*45)%VW+VW)%VW,cy=((gameNow*55*(0.5+i%3*0.3)+i*53.1)%VH+VH)%VH;
      ctx.fillStyle=i%3===0?'#e9b42f':i%3===1?'#c1121f':'#efe3c8';
      ctx.globalAlpha=0.65;ctx.fillRect(cx,cy,4,8);
    }
    ctx.globalAlpha=1;
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='500 58px Gloock,Georgia,serif';ctx.fillStyle='#e9b42f';
  ctx.fillText('¡Bravo!',VW/2,VH*0.3);
  ctx.font='400 20px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='#efe3c8';
  ctx.fillText('Afar recuperó la carta.',VW/2,VH*0.47);
  ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='rgba(239,227,200,0.5)';
  ctx.fillText('Y en el silencio de las cavernas, la leyó.',VW/2,VH*0.47+24);
  ctx.globalAlpha=Math.sin(gameNow*4)*0.18+0.82;
  ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='rgba(239,227,200,0.5)';
  ctx.fillText('Espacio / toca para volver',VW/2,VH*0.7);
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}

// ═══════════════════════════════════════════════════════════
//  INICIAR NIVEL
// ═══════════════════════════════════════════════════════════
function initLevelData(idx){
  lv=JSON.parse(JSON.stringify(LEVELS[idx]));
  platforms=lv.platforms;trapezes=lv.trapezes;
  trapezes.forEach(tr=>{tr.omega=tr.theta>0?-0.65:0.65;});
  clouds=[];
  const n=lv.storm===0?7:lv.storm===1?11:16;
  for(let i=0;i<n;i++)
    clouds.push({x:Math.random()*(lv.worldW||1600),y:12+Math.random()*95,r:26+Math.random()*40});
}

function startLevel(idx){
  levelIdx=idx;initLevelData(idx);initPlayer();
  camX=0;deathCount=0;boltWarning=null;flashAlpha=0;gameBolts=[];
  if(lv.lightning)nextLightning=performance.now()+3000+Math.random()*5000;
  levelStartTime=performance.now();gState='playing';
  if(!musicMuted)MUSIC.start();
}

// ═══════════════════════════════════════════════════════════
//  BUCLE PRINCIPAL
// ═══════════════════════════════════════════════════════════
let lastTime=0;
function frame(now){
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;gameNow=now/1000;

  const curJ=wantsJump(),curL=wantsLeft(),curR=wantsRight();
  jumpPressed=curJ&&!lastJumpState;lastJumpState=curJ;
  const justLeft=curL&&!lastLeft,justRight=curR&&!lastRight;
  lastLeft=curL;lastRight=curR;

  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d');
  ctx.resetTransform();ctx.scale(scale*dpr,scale*dpr);
  ctx.clearRect(0,0,VW,VH);

  updateClouds(dt);

  if(gState==='title'){
    drawTitle(ctx);
    if(jumpPressed||KEY.Enter)startLevel(levelIdx);
    if(justLeft)levelIdx=Math.max(0,levelIdx-1);
    if(justRight){if(levelIdx<2&&levelIdx<getSaved())levelIdx++;}
  }else if(gState==='playing'){
    updatePlayer(dt);updateTrapezes(dt);updateCamera();updateStorm();render(ctx);
  }else if(gState==='levelEnd'){
    render(ctx);drawLevelEnd(ctx);
    if(jumpPressed){if(levelIdx<2)startLevel(levelIdx+1);else gState='ending';}
  }else if(gState==='ending'){
    drawEnding(ctx);
    if(jumpPressed){gState='title';levelIdx=0;initLevelData(0);}
  }

  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════
//  STORAGE  (seguro en data: y private browsing)
// ═══════════════════════════════════════════════════════════
function getSaved(){try{return Math.min(parseInt(localStorage.getItem('afar-level')||'0'),2);}catch(e){return 0;}}
function setSaved(v){try{localStorage.setItem('afar-level',String(v));}catch(e){}}

// ═══════════════════════════════════════════════════════════
//  RESIZE + ARRANQUE
// ═══════════════════════════════════════════════════════════
function resize(){
  const cv=document.getElementById('c'),rw=window.innerWidth,rh=window.innerHeight;
  scale=Math.min(rw/VW,rh/VH);dpr=Math.min(devicePixelRatio||1,2);
  const cw=Math.round(VW*scale),ch=Math.round(VH*scale);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
}
addEventListener('resize',resize);resize();

document.getElementById('c').addEventListener('click',e=>{
  const rect=e.target.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/scale, cy=(e.clientY-rect.top)/scale;
  if(cx>=VW-50&&cx<=VW-10&&cy>=10&&cy<=50)toggleMute();
});

levelIdx=getSaved();
initLevelData(levelIdx);
requestAnimationFrame(frame);
</script>
