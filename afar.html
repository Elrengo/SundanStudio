//  SFX  —  Web Audio API (generado por Haiku)

const SFX=(function(){
  let acx=null,failed=false;
  function getCtx(){
    if(failed)return null;
    if(!acx){try{acx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){failed=true;return null;}}
    if(acx.state==='suspended')acx.resume();
    return acx;
  }
  function tone(ac,type,f0,f1,dur,vol,delay){
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(ac,dur){
    const len=Math.max(1,Math.floor(ac.sampleRate*dur)),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const s=ac.createBufferSource();s.buffer=buf;return s;
  }
  function playJump(){const ac=getCtx();if(!ac)return;tone(ac,'sine',180,520,0.13,0.3,0);}
  function playLand(){const ac=getCtx();if(!ac)return;tone(ac,'sine',90,90,0.06,0.6,0);}
  function playThunder(){
    const ac=getCtx();if(!ac)return;const t=ac.currentTime;
    const src=noise(ac,2.0),bp=ac.createBiquadFilter(),g=ac.createGain();
    bp.type='bandpass';bp.frequency.value=120;bp.Q.value=0.8;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.15);
    g.gain.setValueAtTime(0.9,t+0.55);g.gain.exponentialRampToValueAtTime(0.0001,t+1.95);
    src.connect(bp).connect(g).connect(ac.destination);src.start(t);src.stop(t+2.0);
  }
  function playLightningCrack(){
    const ac=getCtx();if(!ac)return;const t=ac.currentTime;
    const src=noise(ac,0.35),g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1.0,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    src.connect(g).connect(ac.destination);src.start(t);src.stop(t+0.35);
    tone(ac,'sawtooth',1800,120,0.35,0.25,0);
  }
  function playWin(){const ac=getCtx();if(!ac)return;[523,659,784].forEach((f,i)=>tone(ac,'triangle',f,f,0.14,0.3,i*0.14));}
  function playDie(){const ac=getCtx();if(!ac)return;tone(ac,'sine',220,60,0.35,0.5,0);}
  function playDash(){const ac=getCtx();if(!ac)return;tone(ac,'sine',520,130,0.17,0.22,0);tone(ac,'triangle',260,90,0.12,0.08,0);}
  function playSpark(){const ac=getCtx();if(!ac)return;tone(ac,'triangle',660,1320,0.28,0.25,0);tone(ac,'sine',990,1980,0.22,0.12,0.06);}
  return{playJump,playLand,playThunder,playLightningCrack,playWin,playDie,playDash,playSpark};
})();

// ═══════════════════════════════════════════════════════════
//  drawAfar  —  personaje (generado por Haiku)
// ═══════════════════════════════════════════════════════════
function drawAfar(ctx,x,y,facing,animState,animTime,swingTheta){
  var suit='#efe3c8',gold='#e9b42f',limbC='#c8bfa0',ink='#5a4e38';
  var HIP=-14,TORSO=16,UP=7,LO=7,SHX=5,HIPX=2.5,PI=Math.PI;
  function tip(px,py,ang,len){return[px+Math.sin(ang)*len,py+Math.cos(ang)*len];}
  function limb(px,py,a1,a2){
    var p1=tip(px,py,a1,UP),p2=tip(p1[0],p1[1],a2,LO);
    ctx.strokeStyle=limbC;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();
    ctx.fillStyle=limbC;ctx.beginPath();ctx.arc(p2[0],p2[1],1.8,0,PI*2);ctx.fill();
  }
  function figure(p){
    var lift=p.lift||0,sy=p.sy||1,torsoBot=HIP-lift,torsoTop=torsoBot-TORSO*sy;
    var shY=torsoTop+3,headY=torsoTop-5,l=-5,r=5,t=torsoTop,b=torsoBot,k=3;
    limb(-HIPX,HIP,p.legB[0],p.legB[1]);limb(HIPX,HIP,p.legA[0],p.legA[1]);
    limb(-SHX,shY,p.armB[0],p.armB[1]);
    ctx.beginPath();ctx.moveTo(l+k,t);ctx.lineTo(r-k,t);ctx.arcTo(r,t,r,t+k,k);
    ctx.lineTo(r,b-k);ctx.arcTo(r,b,r-k,b,k);ctx.lineTo(l+k,b);ctx.arcTo(l,b,l,b-k,k);
    ctx.lineTo(l,t+k);ctx.arcTo(l,t,l+k,t,k);ctx.closePath();
    ctx.fillStyle=suit;ctx.fill();ctx.strokeStyle=limbC;ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=gold;ctx.fillRect(l,b-3,10,3);
    ctx.beginPath();ctx.arc(0,headY,7,0,PI*2);ctx.fillStyle=suit;ctx.fill();
    ctx.strokeStyle=limbC;ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,headY,6.5,PI*1.15,PI*1.85);ctx.stroke();
    ctx.fillStyle=ink;ctx.beginPath();ctx.arc(2.5,headY+0.5,1,0,PI*2);ctx.fill();
    limb(SHX,shY,p.armA[0],p.armA[1]);
  }
  var s=animState,p;ctx.save();
  if(s==='swing'){
    ctx.translate(x,y);ctx.scale(facing,1);ctx.rotate(swingTheta);ctx.translate(0,41);
    // swingPose: 0=encogido (rodillas al pecho), 0.5=neutro, 1=estirado (piernas adelante)
    var sp=typeof P!=='undefined'&&P.swingPose!=null?P.swingPose:0.5;
    var om=typeof P!=='undefined'?Math.abs(P.swingOmega||0):0;
    var intens=Math.min(1,om*0.8);
    var t=(sp*2-1)*intens; // -1=tuck, 0=neutro, 1=stretch
    var tf=Math.max(0,-t), sf=Math.max(0,t);
    // piernas: neutro upper=0.12 lower=0.07 | tuck upper=-0.72 lower=1.3 | stretch upper=0.42 lower=0.04
    var legU=0.12+tf*(-0.72-0.12)+sf*(0.42-0.12);
    var legL=0.07+tf*(1.3-0.07)+sf*(0.04-0.07);
    // leve lift en tuck (cuerpo se recoge), leve extensión en stretch
    var lft=tf*5-sf*1.5;
    // inclinación de espalda en tuck: cabeza hacia atrás ~15°
    if(tf>0) ctx.rotate(-tf*0.26);
    figure({legA:[legU,legL],legB:[legU-0.04,legL-0.03],
            armA:[PI-0.12,PI-0.05],armB:[-(PI-0.12),-(PI-0.05)],
            lift:lft});
  }else if(s==='trick'){
    ctx.translate(x,y-20);ctx.scale(facing,1);ctx.rotate(animTime*12);
    ctx.beginPath();ctx.arc(0,0,12,0,PI*2);ctx.fillStyle=suit;ctx.fill();
    ctx.strokeStyle=limbC;ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,10,PI*0.9,PI*1.4);ctx.stroke();
    ctx.fillStyle=limbC;ctx.beginPath();ctx.arc(-5,5,3.5,0,PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(5,5,3.5,0,PI*2);ctx.fill();
    ctx.fillStyle=suit;ctx.strokeStyle=limbC;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,-6,4,0,PI*2);ctx.fill();ctx.stroke();
  }else{
    ctx.translate(x,y);ctx.scale(facing,1);
    if(s==='walk'){
      var fr=Math.floor(animTime*8)%4,sg=fr===0?1:(fr===2?-1:0),a=0.384,bv=0.314;
      p=sg?{legA:[a*sg,a*sg*0.5],legB:[-a*sg,-a*sg*0.5],armA:[-bv*sg,-bv*sg+0.15],armB:[bv*sg,bv*sg+0.15]}
           :{legA:[0,0],legB:[0,0],armA:[0,0.15],armB:[0,0.15]};
    }else if(s==='jump'){
      p={legA:[1.0,0.2],legB:[0.9,0.1],armA:[PI-0.52,PI-0.5],armB:[-(PI-0.52),-(PI-0.5)],sy:0.9};
    }else if(s==='fall'){
      p={legA:[-0.2,-0.3],legB:[-0.25,-0.35],armA:[1.22,1.3],armB:[-1.22,-1.3],sy:1.08};
    }else if(s==='dash'){
      // dash: cuerpo inclinado ~20 grados hacia delante, brazos atrás, piernas estiradas
      ctx.rotate(0.35);
      p={legA:[-0.55,-0.5],legB:[-0.85,-0.7],armA:[-1.55,-1.7],armB:[-1.3,-1.5],sy:1.04};
    }else{
      var b=Math.sin(animTime*2.2);
      p={legA:[b*0.07,b*0.03],legB:[-b*0.07,-b*0.03],armA:[0.1+b*0.1,0.22+b*0.06],armB:[-(0.1+b*0.1),-(0.22+b*0.06)],lift:Math.abs(b)*3+0.5};
    }
    figure(p);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
//  ARTE  —  texturas y fondos precalculados (cachés offscreen)
//  Se construyen en initLevelData() y al redimensionar; por frame
//  sólo hay drawImage / patrones y formas simples.
// ═══════════════════════════════════════════════════════════
const MAINC=document.getElementById('c'),MCTX=MAINC.getContext('2d');
const ART={k:1};              // k = escala de los cachés (dpr*scale, acotada)
let artDirty=true,FAR=null,MID=null,FDT=0,WX=[],WN=0,grainSt=-1,grainOx=0,grainOy=0;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mixC(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}
function mkC(w,h,k){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*k));c.height=Math.max(1,Math.ceil(h*k));const x=c.getContext('2d');x.setTransform(k,0,0,k,0,0);return[c,x];}
function mkPat(c,k){const p=MCTX.createPattern(c,'repeat');p.setTransform(new DOMMatrix([1/k,0,0,1/k,0,0]));return p;}
// elipse difuminada (sprite de nube, niebla, sombra)
function softEllipse(w,h,rgb,a){
  const[c,x]=mkC(w,h,1);
  x.translate(w/2,h/2);x.scale(1,h/w);
  const g=x.createRadialGradient(0,0,0,0,0,w/2);
  g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(0.45,`rgba(${rgb},${a*0.6})`);g.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=g;x.fillRect(-w/2,-w/2,w,w);
  return c;
}
// siluetas lejanas: carpas de circo (y estalactitas si storm>=1)
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
// fila de carpas ancladas al horizonte (muros hasta HZ, techo a dos aguas, festón, puerta)
function drawTentRow(x,rnd,W,HZ,col,alpha,isFar){
  const dark=mixHex(col,'#000000',0.28);
  x.globalAlpha=alpha;
  const step=isFar?170:300,gap=isFar?140:230;
  for(let cx=rnd()*160;cx<W+160;cx+=step+rnd()*gap){
    const hw=(isFar?30:52)+rnd()*(isFar?16:48),H=(isFar?46:80)+rnd()*(isFar?24:62);
    const b=HZ,top=b-H,roofY=top+H*0.4,sw=2*hw/Math.max(3,Math.round(hw/12));
    // muros + techo a dos aguas
    x.fillStyle=col;
    x.beginPath();x.moveTo(cx-hw,b);x.lineTo(cx-hw,roofY);x.lineTo(cx-hw*0.16,top);x.lineTo(cx+hw*0.16,top);x.lineTo(cx+hw,roofY);x.lineTo(cx+hw,b);x.closePath();x.fill();
    // franjas verticales del techo (2-3% más claras)
    x.fillStyle='rgba(239,227,200,0.05)';
    for(const[a,c2]of[[-1,-0.6],[-0.2,0.2],[0.6,1]]){x.beginPath();x.moveTo(cx,top);x.lineTo(cx+a*hw,roofY);x.lineTo(cx+c2*hw,roofY);x.closePath();x.fill();}
    // filo claro del techo
    x.strokeStyle='rgba(239,227,200,0.06)';x.lineWidth=1.2;x.beginPath();
    x.moveTo(cx-hw*0.16,top);x.lineTo(cx-hw,roofY);x.moveTo(cx+hw*0.16,top);x.lineTo(cx+hw,roofY);x.stroke();
    // festón (valance) bajo el techo
    x.fillStyle=dark;
    const n=Math.max(3,Math.round(hw/12));
    for(let i=0;i<n;i++){x.beginPath();x.arc(cx-hw+(i+.5)*sw,roofY,sw*0.5,0,Math.PI);x.fill();}
    // puerta oscura y farolillos
    const dw=hw*0.3,dh=(b-roofY)*0.5;
    x.fillStyle='#07020a';
    x.beginPath();x.moveTo(cx-dw,b);x.lineTo(cx-dw,b-dh);x.arc(cx,b-dh,dw,Math.PI,0);x.lineTo(cx+dw,b);x.closePath();x.fill();
    if(!isFar){
      x.globalAlpha=0.5;x.fillStyle='#e9b42f';
      x.beginPath();x.arc(cx-dw-4,b-dh*0.35,1.5,0,TAU);x.fill();
      if(rnd()<0.5){x.beginPath();x.arc(cx+dw+4,b-dh*0.35,1.5,0,TAU);x.fill();}
      x.globalAlpha=alpha;
    }
    // mástil y banderín
    x.fillStyle=col;x.fillRect(cx-0.7,top-22,1.4,22);
    x.fillStyle='rgba(193,18,31,0.35)';x.beginPath();x.moveTo(cx,top-22);x.lineTo(cx+10,top-18);x.lineTo(cx,top-14);x.closePath();x.fill();
  }
  x.globalAlpha=1;
}
function paintSilhouettes(W,seed,bgc,storm){
  const[c,x]=mkC(W,VH,ART.k);
  const rnd=mulberry(seed);
  const HZ=VH*0.88;
  const body=mixHex(mixHex(bgc,'#1b0812',0.55),'#efe3c8',0.05);   // carpas cercanas
  const far=mixHex(mixHex(bgc,'#1b0812',0.3),'#efe3c8',0.03);     // lejanas: menos contraste
  const rock=mixHex(mixHex(bgc,'#1b0812',0.4),'#efe3c8',0.04);
  if(storm>=1){
    // techo de caverna irregular + estalactitas colgando
    x.fillStyle=rock;x.beginPath();x.moveTo(0,-1);
    for(let px=0;px<=W+12;px+=12)x.lineTo(px,4+rnd()*12);
    x.lineTo(W+12,-1);x.closePath();x.fill();
    for(let sx=rnd()*30;sx<W+20;sx+=24+rnd()*44){
      const hw=5+rnd()*11,L=34+rnd()*(storm>=2?150:100);
      x.beginPath();x.moveTo(sx-hw,2);x.lineTo(sx+hw,2);
      x.lineTo(sx+(rnd()-.5)*5,L*0.55);x.lineTo(sx+(rnd()-.5)*3,L);x.closePath();x.fill();
    }
  }
  drawTentRow(x,rnd,W,HZ,far,0.5,true);     // lejanas, pequeñas, primero
  x.fillStyle=body;x.globalAlpha=0.85;x.fillRect(0,HZ,W,VH-HZ);   // suelo/horizonte
  x.globalAlpha=1;
  drawTentRow(x,rnd,W,HZ,body,0.85,false);  // cercanas
  return c;
}

// cuerdas y guirnaldas de banderines (capa media, paralaje 0.22)
function buildMid(){
  const rnd=mulberry(77+levelIdx*19);
  const MW=Math.ceil(VW+lv.worldW*0.22+40);
  const ropes=[],garl=[];
  for(let x=rnd()*140;x<MW;x+=190+rnd()*240)ropes.push({x,len:110+rnd()*120,ph:rnd()*TAU});
  for(let x=40+rnd()*120;x<MW;x+=360+rnd()*200)garl.push({x,w:170+rnd()*120,sag:12+rnd()*12,y0:4+rnd()*10,ph:rnd()*TAU});
  return{ropes,garl};
}

function buildArt(){
  artDirty=false;
  const k=ART.k=Math.max(0.5,Math.min(dpr*scale,2.5));
  if(!ART.grain){
    const[nc,nx]=mkC(160,160,1),id=nx.createImageData(160,160),d=id.data;
    for(let i=0;i<160*160;i++){const v=Math.random()*256|0;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=Math.random()*15|0;}
    nx.putImageData(id,0,0);ART.grain=mkPat(nc,1);
  }
  // viñeta
  const[vc,vx]=mkC(VW,VH,k),vg=vx.createRadialGradient(VW/2,VH/2,VH*0.5,VW/2,VH/2,VW*0.62);
  vg.addColorStop(0,'rgba(8,2,8,0)');vg.addColorStop(1,'rgba(8,2,8,0.62)');
  vx.fillStyle=vg;vx.fillRect(0,0,VW,VH);ART.vig=vc;
  // banda de niebla baja (tinta -> transparente hacia arriba)
  const FH=VH*0.32;
  const[fc,fx]=mkC(VW,FH,k),fg=fx.createLinearGradient(0,0,0,FH);
  fg.addColorStop(0,'rgba(20,6,15,0)');fg.addColorStop(1,'rgba(20,6,15,0.9)');
  fx.fillStyle=fg;fx.fillRect(0,0,VW,FH);ART.fog=fc;
  // sombreado vertical de plataformas
  const[sc,sx]=mkC(2,64,1),sg=sx.createLinearGradient(0,0,0,64);
  sg.addColorStop(0,'rgba(255,220,200,0.16)');sg.addColorStop(0.35,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,0.42)');
  sx.fillStyle=sg;sx.fillRect(0,0,2,64);ART.shade=sc;
  // terciopelo con pliegues verticales (patrón 24px)
  const[vt,vtx]=mkC(24,64,k),hg=vtx.createLinearGradient(0,0,24,0);
  hg.addColorStop(0,'#8f0d18');hg.addColorStop(0.3,'#b0101d');hg.addColorStop(0.45,'#c1121f');hg.addColorStop(0.62,'#970c17');hg.addColorStop(1,'#8f0d18');
  vtx.fillStyle=hg;vtx.fillRect(0,0,24,64);ART.velvet=mkPat(vt,k);
  // franja dorada
  const[gt,gtx]=mkC(4,4,k),gg=gtx.createLinearGradient(0,0,0,4);
  gg.addColorStop(0,'#f5cf5a');gg.addColorStop(1,'#b8861c');gtx.fillStyle=gg;gtx.fillRect(0,0,4,4);ART.gold=mkPat(gt,k);
  // remaches dorados cada 36px
  const[st,stx]=mkC(36,4,k);
  stx.fillStyle='#7a5610';stx.beginPath();stx.arc(18,2,1.7,0,TAU);stx.fill();
  stx.fillStyle='#fff3c4';stx.beginPath();stx.arc(17.5,1.4,0.6,0,TAU);stx.fill();
  ART.stud=mkPat(st,k);
  // festón oscuro del faldón
  const[fr,frx]=mkC(24,14,k);frx.fillStyle='#6a0810';frx.beginPath();frx.arc(12,0,12,0,Math.PI);frx.fill();ART.fringe=mkPat(fr,k);
  // sprites
  ART.shadow=softEllipse(96,20,'0,0,0',0.55);
  ART.blob=softEllipse(320,140,'150,120,140',0.55);
  ART.coneH=Math.round(VH*1.35);
  const[cc,cxx]=mkC(300,ART.coneH,k),cg=cxx.createLinearGradient(0,0,0,ART.coneH);
  cg.addColorStop(0,'rgba(239,227,200,0)');cg.addColorStop(0.55,'rgba(239,227,200,0.3)');cg.addColorStop(1,'rgba(239,227,200,1)');
  cxx.fillStyle=cg;cxx.beginPath();cxx.moveTo(0,0);cxx.lineTo(300,0);cxx.lineTo(170,ART.coneH);cxx.lineTo(130,ART.coneH);cxx.closePath();cxx.fill();
  ART.cone=cc;
  // nubes del nivel y de la pantalla de título
  const ca=lv.storm===0?0.3:lv.storm===1?0.65:0.82,cr=lv.storm===0?'60,25,60':lv.storm===1?'20,8,28':'10,3,15';
  ART.cloud=softEllipse(256,96,cr,ca);
  ART.cloudT=softEllipse(256,96,'60,25,60',0.3);
  // banderines (3 colores, 35% alpha)
  ART.pen=[['193,18,31'],['233,180,47'],['239,227,200']].map(rgb=>{
    const[c,x]=mkC(10,13,k);x.fillStyle=`rgba(${rgb},0.35)`;x.beginPath();x.moveTo(0,0);x.lineTo(10,0);x.lineTo(5,13);x.closePath();x.fill();return c;
  });
  // capas por nivel
  ART.farW=Math.ceil(VW+lv.worldW*0.08+40);
  FAR=paintSilhouettes(ART.farW,900+levelIdx*131,lv.bgBot,lv.storm);
  MID=buildMid();
  ART.tentsT=paintSilhouettes(VW,4242,'#0e040b',0);
}

function drawFilm(ctx){
  const st=reduce?0:Math.floor(gameNow*12.5);   // grano desplazado cada ~80ms
  if(st!==grainSt){grainSt=st;grainOx=Math.random()*160|0;grainOy=Math.random()*160|0;}
  ctx.save();ctx.globalAlpha=0.55;
  ctx.translate(reduce?0:grainOx,reduce?0:grainOy);
  ctx.fillStyle=ART.grain;ctx.fillRect(-160,-160,VW+320,VH+320);
  ctx.restore();
  ctx.drawImage(ART.vig,0,0,VW,VH);
}

function drawCone(ctx,ox,oy,ang,a){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;
  ctx.translate(ox,oy);ctx.rotate(ang);
  ctx.drawImage(ART.cone,-150,-ART.coneH,300,ART.coneH);
  ctx.restore();
}
function drawSpots(ctx){
  const a=reduce?-0.1:Math.sin(gameNow*TAU/9)*0.21;     // barrido ±12° en ~9s
  const b=reduce?0.1:Math.sin(gameNow*TAU/9+2)*0.21;
  drawCone(ctx,VW*0.2,VH+10,a,0.06);
  drawCone(ctx,VW*0.8,VH+10,b,0.05);
}
function drawMid(ctx){
  if(!MID)return;
  const ox=-camX*0.22,t=reduce?0:gameNow;
  ctx.save();ctx.lineWidth=1;
  ctx.strokeStyle='rgba(239,227,200,0.22)';ctx.beginPath();
  for(const r of MID.ropes){
    const sx=r.x+ox;if(sx<-30||sx>VW+30)continue;
    const sw=Math.sin(t*0.55+r.ph)*7;
    ctx.moveTo(sx,-2);ctx.quadraticCurveTo(sx+sw*0.3,r.len*0.5,sx+sw,r.len);
  }
  ctx.stroke();
  for(const g of MID.garl){
    const sx0=g.x+ox;if(sx0>VW+20||sx0+g.w<-20)continue;
    ctx.beginPath();ctx.moveTo(sx0,g.y0);ctx.quadraticCurveTo(sx0+g.w/2,g.y0+g.sag*2,sx0+g.w,g.y0);
    ctx.strokeStyle='rgba(239,227,200,0.2)';ctx.stroke();
    const n=Math.floor(g.w/13);
    for(let i=0;i<n;i++){
      const u=(i+0.5)/n,bell=4*u*(1-u);
      const px=sx0+u*g.w+Math.sin(t*0.8+g.ph+i*0.5)*2.2*bell;
      const py=g.y0+g.sag*bell;
      ctx.drawImage(ART.pen[i%3],px-5,py,10,13);
    }
  }
  ctx.restore();
}
function drawFog(ctx){
  ctx.drawImage(ART.fog,0,VH*0.68,VW,VH*0.32);
  for(let i=0;i<4;i++){
    const x=((i*197.3+(reduce?0:gameNow*(6+i*2.5)))%(VW+400))-200;
    ctx.globalAlpha=0.25+(i%2)*0.12;
    ctx.drawImage(ART.blob,x-160,VH*(0.6+(i%2)*0.14)-70,320,140);
  }
  ctx.globalAlpha=1;
}
// partículas de viento/lluvia: array fijo reciclado, sin asignaciones por frame
function initWeather(){
  WX=[];WN=0;
  if(reduce||lv.storm===0)return;
  for(let i=0;i<25;i++)WX.push({dx:-0.99,dy:0.14,v:330+Math.random()*110,l:30+Math.random()*40,x:Math.random()*(VW+80),y:Math.random()*VH});
  WN=25;
  if(lv.storm===2)for(let i=0;i<75;i++)WX.push({dx:-0.2,dy:0.98,v:520+Math.random()*120,l:9+Math.random()*10,x:Math.random()*(VW+80),y:Math.random()*VH});
}
function stepP(p){
  p.x+=p.dx*p.v*FDT;p.y+=p.dy*p.v*FDT;
  if(p.y>VH+30||p.x<-80){
    if(p.dy<0.5){p.x=VW+Math.random()*60;p.y=Math.random()*VH;}
    else{p.x=Math.random()*(VW+80);p.y=-12;}
  }
}
function drawWeather(ctx){
  ctx.lineCap='round';ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<WN;i++){const p=WX[i];stepP(p);ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.dx*p.l,p.y-p.dy*p.l);}
  ctx.strokeStyle='rgba(239,227,200,0.11)';ctx.stroke();
  if(WX.length>WN){
    ctx.beginPath();
    for(let i=WN;i<WX.length;i++){const p=WX[i];stepP(p);ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.dx*p.l,p.y-p.dy*p.l);}
    ctx.strokeStyle='rgba(239,227,200,0.16)';ctx.stroke();
  }
}

//  DASH, PARTÍCULAS Y CHISPA DEL RAYO (nivel IV)
// ═══════════════════════════════════════════════════════════
let PARTS=[];
function spawnPart(x,y,vx,vy,life,col,r){
  if(PARTS.length>90)return;
  PARTS.push({x,y,vx,vy,life,max:life,col,r:r||2});
}
function spawnBurst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=60+Math.random()*160;
    spawnPart(x,y,Math.cos(a)*s,Math.sin(a)*s*0.6-20,0.35+Math.random()*0.25,i%2?'#fff3c4':'#e9b42f',1.6);
  }
}
function spawnDust(x,y,dir){
  for(let i=0;i<6;i++)spawnPart(x-dir*6,y-2,-dir*(40+Math.random()*60),-(10+Math.random()*30),0.45,'#efe3c8',3+Math.random()*2);
}
function updateParts(dt){
  PARTS=PARTS.filter(p=>{
    p.life-=dt;if(p.life<=0)return false;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.05,dt);p.vy+=GRAVITY*0.25*dt;
    return true;
  });
}
function drawParts(ctx){
  if(!PARTS.length)return;
  ctx.save();
  for(const p of PARTS){
    const sx=p.x-camX;if(sx<-10||sx>VW+10)continue;
    ctx.globalAlpha=Math.max(0,p.life/p.max)*0.9;
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(sx,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function startDash(){
  const L=wantsLeft(),R=wantsRight();
  const dir=dashDirReq||(R&&!L?1:(L&&!R?-1:P.facing));
  P.dashDir=dir;P.facing=dir;P.dashT=DASH_TIME;P.dashCd=DASH_CD;P.airDashUsed=true;P.trail=[];
  SFX.playDash();
  spawnBurst(P.x-dir*6,P.y-PH*0.45,10);
  if(P.onGround)spawnDust(P.x,P.y,dir);
}
// chispa del rayo (sólo nivel IV): se atrapa tocándola con el cuerpo
function checkSpark(){
  if(!lv.spark||sparkTaken||P.deathAnim>0||gState!=='playing')return;
  const dx=P.x-lv.spark.x,dy=(P.y-23)-lv.spark.y;
  if(dx*dx+dy*dy<36*36){
    sparkTaken=true;P.canDash=true;
    flashAlpha=0.9;SFX.playSpark();
    spawnBurst(lv.spark.x,lv.spark.y,22);
    banner={t0:gameNow};
    nextLightning=performance.now()+2500;
  }
}
function drawSpark(ctx){
  if(!lv.spark||sparkTaken)return;
  const sx=lv.spark.x-camX;if(sx<-60||sx>VW+60)return;
  const cy=lv.spark.y+(reduce?0:Math.sin(gameNow*2.4)*3);
  const pulse=reduce?0.8:0.75+0.25*Math.sin(gameNow*5);
  ctx.save();
  const g=ctx.createRadialGradient(sx,cy,0,sx,cy,34);
  g.addColorStop(0,'rgba(255,246,220,'+(0.55*pulse).toFixed(3)+')');
  g.addColorStop(0.4,'rgba(233,180,47,'+(0.25*pulse).toFixed(3)+')');
  g.addColorStop(1,'rgba(233,180,47,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,cy,34,0,TAU);ctx.fill();
  ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(sx,cy,2.6,0,TAU);ctx.fill();
  if(!reduce){
    for(let i=0;i<4;i++){
      const a=gameNow*3+i*Math.PI/2,rr=11+Math.sin(gameNow*4+i)*1.5;
      ctx.fillStyle=i%2?'#e9b42f':'#fff3c4';
      ctx.beginPath();ctx.arc(sx+Math.cos(a)*rr,cy+Math.sin(a)*rr*0.6,1.5,0,TAU);ctx.fill();
    }
  }
  ctx.restore();
}
// fantasmas de Afar (3-4, tinte dorado->teal) + líneas de velocidad; con reduce: un solo rastro tenue
function drawDashTrail(ctx){
  const ghosts=P.trail.slice(0,-1);   // posiciones anteriores (la última es la actual)
  ctx.save();
  if(reduce){
    const g=ghosts[ghosts.length-1];
    if(g){ctx.globalAlpha=0.18;drawAfar(ctx,g.x-camX,g.y,g.f,'dash',P.animTime,0);}
  }else{
    if('filter' in ctx)ctx.filter='hue-rotate(150deg) saturate(1.5)';
    const m=ghosts.length;
    ghosts.forEach((g,i)=>{ctx.globalAlpha=m>1?0.1+0.35*i/(m-1):0.3;drawAfar(ctx,g.x-camX,g.y,g.f,'dash',P.animTime,0);});
    ctx.filter='none';
  }
  ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineWidth=1.2;
  const px=P.x-camX,py=P.y-PH*0.5,d=P.dashDir;
  for(let i=0;i<5;i++){
    const yo=(i-2)*8+(reduce?0:Math.sin(gameNow*30+i*2)*2);
    const x0=px-d*(14+i*3),len=26+i*7+(reduce?0:Math.sin(gameNow*40+i)*6);
    ctx.strokeStyle='rgba(239,227,200,'+(0.32-i*0.05).toFixed(2)+')';
    ctx.beginPath();ctx.moveTo(x0,py+yo);ctx.lineTo(x0-d*len,py+yo);ctx.stroke();
  }
  ctx.restore();
}

//  INPUT

const KEY={};
const TOUCH={left:false,right:false,up:false};
let jumpPressed=false,lastJumpState=false,lastLeft=false,lastRight=false;
let dashPressed=false,lastDashState=false,tapDashDir=0,dashDirReq=0,lastTapSide='',lastTapT=0;

function toggleMute(){
  musicMuted=!musicMuted;
  if(musicMuted)MUSIC.stop();else MUSIC.start();
}
addEventListener('keydown',e=>{
  KEY[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{KEY[e.code]=false;});
addEventListener('touchstart',e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const nx=t.clientX/window.innerWidth;
    const side=nx<0.33?'left':nx>0.67?'right':'up';
    if(side==='up')TOUCH.up=true;else TOUCH[side]=true;
    // doble toque (<250 ms) en un lateral = dash hacia ese lado
    if(side!=='up'){
      const now=performance.now();
      if(lastTapSide===side&&now-lastTapT<250){tapDashDir=side==='left'?-1:1;lastTapSide='';}
      else{lastTapSide=side;lastTapT=now;}
    }
  });
},{passive:false});
addEventListener('touchend',e=>{
  e.preventDefault();TOUCH.left=TOUCH.right=TOUCH.up=false;
  Array.from(e.touches).forEach(t=>{
    const nx=t.clientX/window.innerWidth;
    if(nx<0.33)TOUCH.left=true;else if(nx>0.67)TOUCH.right=true;else TOUCH.up=true;
  });
},{passive:false});

function wantsLeft(){return KEY.ArrowLeft||KEY.KeyA||TOUCH.left;}
function wantsRight(){return KEY.ArrowRight||KEY.KeyD||TOUCH.right;}
function wantsJump(){return KEY.ArrowUp||KEY.Space||KEY.KeyW||TOUCH.up;}

// ═══════════════════════════════════════════════════════════
//  FÍSICA
// ═══════════════════════════════════════════════════════════
function movingX(pl){
  if(!pl.moving)return pl.x;
  return pl.x+Math.sin(gameNow*pl.mspd)*pl.mx;
}

function updatePlayer(dt){
  P.dashCd=Math.max(0,P.dashCd-dt);
  if(P.grabbed){updateSwing(dt);return;}
  if(P.deathAnim>0){P.deathAnim-=dt;return;}

  // dash: Shift (flanco) o doble toque; requiere desbloqueo, cooldown listo y (en suelo o aire sin usar)
  if(dashPressed&&P.canDash&&P.dashT<=0&&P.dashCd<=0&&(P.onGround||!P.airDashUsed))startDash();
  const dashing=P.dashT>0;

  if(dashing){
    P.dashT-=dt;P.vx=DASH_SPD*P.dashDir;P.vy=0;   // sin gravedad durante el dash
    P.trail.push({x:P.x,y:P.y,f:P.facing});if(P.trail.length>5)P.trail.shift();
  }else{
    const left=wantsLeft(),right=wantsRight();
    if(left&&!right){P.vx=-WALK_SPD;if(P.onGround)P.facing=-1;}
    else if(right&&!left){P.vx=WALK_SPD;if(P.onGround)P.facing=1;}
    else P.vx*=Math.pow(0.0001,dt);

    if(jumpPressed&&P.onGround){
      P.vy=JUMP_VEL;P.onGround=false;SFX.playJump();
    }else if(jumpPressed&&!P.onGround){
      tryGrab();
    }

    P.vy+=GRAVITY*dt;
  }
  const prevY=P.y,prevX=P.x;
  P.x+=P.vx*dt;
  P.y+=P.vy*dt;

  // dash y deslizamiento posterior (|vx|>WALK_SPD): se detienen contra plataformas que cruzan la altura del cuerpo
  if(dashing||Math.abs(P.vx)>WALK_SPD){
    for(const pl of platforms){
      if(!(P.y>pl.y&&P.y-PH<pl.y+pl.h))continue;
      const plx=movingX(pl);
      if(P.vx>0&&prevX+PW/2<=plx&&P.x+PW/2>plx){P.x=plx-PW/2;P.dashT=0;P.vx=0;break;}
      if(P.vx<0&&prevX-PW/2>=plx+pl.w&&P.x-PW/2<plx+pl.w){P.x=plx+pl.w+PW/2;P.dashT=0;P.vx=0;break;}
    }
    if(P.dashT<=0)P.trail=[];
  }

  const wasOnGround=P.onGround;
  P.onGround=false;

  platforms.forEach(pl=>{
    const plx=movingX(pl);
    if(P.x+PW/2<=plx||P.x-PW/2>=plx+pl.w)return;
    if(P.vy>=0&&prevY<=pl.y&&P.y>=pl.y){
      P.y=pl.y;P.vy=0;P.onGround=true;
      if(!wasOnGround)SFX.playLand();
    }
    if(P.vy<0&&(prevY-PH)>=(pl.y+pl.h)&&(P.y-PH)<(pl.y+pl.h)){
      P.y=pl.y+pl.h+PH;P.vy=0;
    }
  });

  // aterrizar (en suelo) restaura el air dash; un dash iniciado en el suelo que se despega no lo restaura
  if(P.onGround&&P.dashT<=0)P.airDashUsed=false;
  if(P.x<PW/2){P.x=PW/2;P.vx=0;}
  if(P.y>VH+100)die();

  if(P.onGround&&lv.goal&&P.x>lv.goal.x&&P.y<=lv.goal.y+30&&gState==='playing'){
    gState='levelEnd';SFX.playWin();
    if(levelIdx+1>getSaved())setSaved(levelIdx+1);
  }

  if(P.dashT>0){P.state='dash';}
  else if(P.trickAnim>0){P.state='trick';P.trickAnim-=dt;}
  else if(!P.onGround&&P.vy<-100)P.state='jump';
  else if(!P.onGround)P.state='fall';
  else if(Math.abs(P.vx)>10)P.state='walk';
  else P.state='idle';
  P.animTime+=dt;
}

function updateSwing(dt){
  const tr=P.grabbed;
  const lean=wantsRight()?1:wantsLeft()?-1:0;
  if(lean!==0){
    if(Math.sign(lean)===Math.sign(P.swingOmega)) P.swingOmega+=lean*2.2*dt;  // pump
    else P.swingOmega*=Math.pow(0.04,dt);  // freno: decaimiento rápido al presionar opuesto
  }
  const alpha=-(GRAVITY/tr.L)*Math.sin(P.swingTheta)-DAMP*P.swingOmega;
  P.swingOmega+=alpha*dt;P.swingTheta+=P.swingOmega*dt;
  P.x=tr.px+Math.sin(P.swingTheta)*tr.L;
  P.y=tr.py+Math.cos(P.swingTheta)*tr.L;
  P.state='swing';P.animTime+=dt;
  // pose: depende de la tecla presionada
  var poseTarget=0.5; // neutral sin input
  if(lean>0) poseTarget=1;      // derecha → stretch
  else if(lean<0) poseTarget=0; // izquierda → tuck
  P.swingPose+=(poseTarget-P.swingPose)*Math.min(1,8*dt);
  if(jumpPressed){
    P.vx=Math.cos(P.swingTheta)*tr.L*P.swingOmega;
    P.vy=JUMP_VEL*0.5; // 50% del salto normal desde el suelo
    if(Math.abs(P.swingTheta)>Math.PI/3)P.trickAnim=0.55;
    P.grabbed=null;
  }
  if(P.y>VH+100)die();
}

function tryGrab(){
  let best=null,bd=GRAB_R*GRAB_R;
  trapezes.forEach(tr=>{
    const bx=tr.px+Math.sin(tr.theta)*tr.L,by=tr.py+Math.cos(tr.theta)*tr.L;
    const d2=(P.x-bx)*(P.x-bx)+(P.y-by)*(P.y-by);
    if(d2<bd){bd=d2;best=tr;}
  });
  if(best){
    P.grabbed=best;P.dashT=0;P.airDashUsed=false;   // agarrar un trapecio restaura el air dash
    P.swingTheta=Math.atan2(P.x-best.px,P.y-best.py);
    P.swingOmega=best.omega*0.4;
    P.vy=0;P.vx=0;
  }
}

function resetTrapezes(){
  LEVELS[levelIdx].trapezes.forEach((orig,i)=>{
    trapezes[i].theta=orig.theta;
    trapezes[i].omega=orig.theta>0?-0.65:0.65;
  });
}

function die(){
  if(P.deathAnim>0||gState!=='playing')return;
  deathCount++;SFX.playDie();P.grabbed=null;P.deathAnim=1.1;
  boltWarning=null;
  setTimeout(()=>{if(gState==='playing'){resetTrapezes();initPlayer();snapCamera();nextLightning=Math.max(nextLightning,performance.now()+2000);}},1100);
}

function updateTrapezes(dt){
  trapezes.forEach(tr=>{
    if(P.grabbed&&P.grabbed.id===tr.id){
      // Sincronizar con el ángulo real del jugador (evita congelamiento visual)
      tr.theta=P.swingTheta;tr.omega=P.swingOmega;
      return;
    }
    const alpha=-(GRAVITY/tr.L)*Math.sin(tr.theta)-DAMP*tr.omega;
    tr.omega+=alpha*dt;tr.theta+=tr.omega*dt;
  });
}

// Cámara con look-ahead: el ancla (posición de Afar en pantalla, fracción de VW) se desliza
// a 0.33 al ir a la derecha y a 0.6 al ir a la izquierda (~2.5/s); camX persigue el objetivo.
let camAnchor=0.33;
function camClamp(x){return Math.max(0,Math.min((lv.worldW||VW)-VW,x));}
function snapCamera(){camAnchor=0.33;camX=camClamp(P.x-VW*camAnchor);}
function updateCamera(dt){
  const dirRight=Math.abs(P.vx)>20?P.vx>0:P.facing===1;
  camAnchor+=((dirRight?0.33:0.6)-camAnchor)*Math.min(1,dt*2.5);
  const target=camClamp(P.x-VW*camAnchor);
  camX=camClamp(camX+(target-camX)*Math.min(1,dt*6));
}

function updateClouds(dt){
  if(!clouds)return;
  clouds.forEach(cl=>{
    cl.x-=dt*18;
    if(cl.x<-200)cl.x=(lv?lv.worldW:1600)+100+Math.random()*200;
  });
}

// ═══════════════════════════════════════════════════════════
//  RAYO — funciones compartidas
// ═══════════════════════════════════════════════════════════
function boltA(u){return u<.12?1:u<.22?.2:u<.36?.95:Math.pow(Math.max(0,1-(u-.36)/.64),1.5);}
function mkBolt(x0,y0,x1,y1,d){
  var pts=[[x0,y0]];
  (function sub(ax,ay,bx,by,dd,o){
    if(dd===0){pts.push([bx,by]);return;}
    var mx=(ax+bx)/2+(Math.random()-.5)*o,my=(ay+by)/2+(Math.random()-.5)*o*.3;
    sub(ax,ay,mx,my,dd-1,o/2);sub(mx,my,bx,by,dd-1,o/2);
  })(x0,y0,x1,y1,d,Math.hypot(x1-x0,y1-y0)*.22);
  return pts;
}
function drawGameBolts(ctx){
  if(!gameBolts.length)return;
  ctx.save();ctx.translate(-camX,0);ctx.globalCompositeOperation='lighter';   // rayos en coords. de mundo
  gameBolts=gameBolts.filter(b=>{
    const u=(gameNow-b.t0)/b.dur;if(u>=1)return false;
    b.a=boltA(u);
    [[8,.08,'#f2d9a0'],[3.5,.3,'#f6c453'],[1.5,1,'#fff7e6']].forEach(L=>{
      ctx.strokeStyle=L[2];ctx.lineJoin='round';ctx.lineCap='round';
      [b.pts,...b.br].forEach((p,k)=>{
        ctx.lineWidth=L[0]*(k?.5:1);ctx.globalAlpha=Math.min(1,L[1]*b.a);
        ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
        for(let j=1;j<p.length;j++)ctx.lineTo(p[j][0],p[j][1]);ctx.stroke();
      });
    });
    ctx.globalAlpha=1;return true;
  });
  ctx.globalCompositeOperation='source-over';ctx.restore();
}

// ═══════════════════════════════════════════════════════════
//  TORMENTA
// ═══════════════════════════════════════════════════════════
// Todas las posiciones de rayo (boltWarning.x, gameBolts) son de MUNDO; el dibujo resta camX.
const BOLT_HIT=30;        // radio de impacto desde el centro de Afar (P.x)
const BOLT_GOAL_SAFE=140; // sin impactos cerca de la meta
const BOLT_GRACE=3000;    // sin impactos en los primeros ms de cada nivel
function boltClampX(x){return Math.max(camX+40,Math.min(camX+VW-40,x));}
function updateStorm(){
  if(!lv||!lv.lightning||lv.storm===0)return;
  if(lv.spark&&!sparkTaken)return;   // nivel IV: sin rayos hasta coger la chispa
  const now=gameNow*1000;
  const goalX=lv.goal?lv.goal.x:Infinity;
  // Programar un aviso: apuntar a donde Afar estará (predicción) + jitter, dentro de pantalla
  if(!boltWarning&&now>nextLightning){
    const playable=gState==='playing'&&P.deathAnim<=0;
    const nearGoal=P.x>goalX-BOLT_GOAL_SAFE;
    if(!playable||nearGoal||performance.now()-levelStartTime<BOLT_GRACE){
      nextLightning=now+500;  // reintento pronto, sin disparar
    }else{
      const warn=lv.lightning.warnTime;
      const vx=Math.max(-WALK_SPD,Math.min(WALK_SPD,P.vx));
      const tx=boltClampX(P.x+vx*(warn/1000)*0.6+(Math.random()*80-40));
      boltWarning={x:tx,start:now,dur:warn};
      SFX.playThunder();
    }
  }
  if(boltWarning&&now>=boltWarning.start+boltWarning.dur){
    // Rayo visual: trazo dentado desde la cima hasta el suelo (coords. de mundo)
    const lx=boltWarning.x;
    const pts=mkBolt(lx,0,lx+(Math.random()-.5)*12,VH,6);
    const br=[];
    for(let k=0;k<2;k++){
      const p=pts[Math.floor(pts.length*(0.3+Math.random()*0.4))];
      br.push(mkBolt(p[0],p[1],p[0]+(Math.random()-.5)*VW*.12,p[1]+VH*.09,3));
    }
    gameBolts.push({pts,br,t0:gameNow,dur:0.56,a:1});
    flashAlpha=1;SFX.playLightningCrack();
    if(gState==='playing'&&P.deathAnim<=0&&P.x<goalX-BOLT_GOAL_SAFE&&Math.abs(P.x-lx)<BOLT_HIT)die();
    boltWarning=null;
    // Próximo impacto = ahora + interval*(0.75..1.25); el aviso empieza warnTime antes
    nextLightning=now+lv.lightning.interval*(0.75+Math.random()*0.5)-lv.lightning.warnTime;
  }
  if(flashAlpha>0)flashAlpha=Math.max(0,flashAlpha-0.03);
}

function drawBackground(ctx){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,lv.bgTop);gr.addColorStop(1,lv.bgBot);
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);

  if(lv.storm===0&&!reduce){
    for(let i=0;i<48;i++){
      const sx=(i*137.5)%VW,sy=(i*61.8)%160;
      ctx.globalAlpha=0.15+(Math.sin(gameNow*0.9+i)*0.5+0.5)*0.5;
      ctx.fillStyle='#efe3c8';ctx.beginPath();ctx.arc(sx,sy,0.7,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // capa lejana: carpas y estalactitas (paralaje 0.08)
  if(FAR)ctx.drawImage(FAR,-camX*0.08,0,ART.farW,VH);
  // haces de foco (apagados en la tormenta 3)
  if(lv.storm<2)drawSpots(ctx);
  // capa media: cuerdas y guirnaldas (paralaje 0.22)
  drawMid(ctx);
  // nubes desde sprite precalculado
  clouds.forEach(cl=>{
    const sx=cl.x-camX*0.4;
    if(sx<-cl.r*2||sx>VW+cl.r*2)return;
    ctx.drawImage(ART.cloud,sx-cl.r*1.6,cl.y-cl.r*0.55,cl.r*3.2,cl.r*1.1);
  });
  // niebla baja
  drawFog(ctx);
  // clima (sólo con movimiento)
  if(lv.storm>=1&&!reduce)drawWeather(ctx);
}

function drawPlatforms(ctx){
  const A=ART;
  platforms.forEach(pl=>{
    const px=movingX(pl)-camX;
    if(px+pl.w<-20||px>VW+20)return;
    // sombra de contacto suave (sprite)
    ctx.drawImage(A.shadow,px-12,pl.y+pl.h-6,pl.w+24,16);
    // plataformas móviles: cuerdas hacia la parte superior
    if(pl.moving){
      ctx.strokeStyle='rgba(239,227,200,0.25)';ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(px+6,pl.y);ctx.lineTo(px+6,0);
      ctx.moveTo(px+pl.w-6,pl.y);ctx.lineTo(px+pl.w-6,0);ctx.stroke();
    }
    ctx.save();ctx.translate(px,pl.y);
    // cuerpo: terciopelo con pliegues + sombreado vertical
    ctx.fillStyle=A.velvet;ctx.fillRect(0,0,pl.w,pl.h);
    ctx.drawImage(A.shade,0,0,pl.w,pl.h);
    // faldón festoneado con cordón dorado (piezas altas)
    if(pl.h>30){
      ctx.save();ctx.translate(0,pl.h-14);
      ctx.fillStyle=A.fringe;ctx.fillRect(0,0,pl.w,14);
      ctx.restore();
      ctx.fillStyle='rgba(233,180,47,0.75)';ctx.fillRect(0,pl.h-14,pl.w,1);
    }
    // franja superior dorada, remaches y brillo
    ctx.fillStyle=A.gold;ctx.fillRect(0,0,pl.w,4);
    ctx.fillStyle=A.stud;ctx.fillRect(0,0,pl.w,4);
    ctx.fillStyle='rgba(255,246,220,0.55)';ctx.fillRect(0,0,pl.w,1);
    ctx.restore();
  });
}

function drawTrapezes(ctx){
  trapezes.forEach(tr=>{
    // Si el jugador tiene este trapecio, usar su ángulo real (no el congelado)
    const drawTheta=(P.grabbed&&P.grabbed.id===tr.id)?P.swingTheta:tr.theta;
    const pivX=tr.px-camX,bx=pivX+Math.sin(drawTheta)*tr.L,by=tr.py+Math.cos(drawTheta)*tr.L;
    if(bx<-80||bx>VW+80)return;
    ctx.save();ctx.lineCap='round';
    // dos cuerdas desde el soporte hasta los extremos de la barra
    ctx.beginPath();
    ctx.moveTo(pivX-2.5,tr.py);ctx.lineTo(bx-16,by);
    ctx.moveTo(pivX+2.5,tr.py);ctx.lineTo(bx+16,by);
    ctx.strokeStyle='rgba(239,227,200,0.6)';ctx.lineWidth=2;ctx.stroke();
    // torsión: guiones oscuros sobre la cuerda
    ctx.strokeStyle='rgba(40,16,26,0.3)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();
    ctx.setLineDash([]);
    // barra dorada con remates redondeados y resplandor
    const bg=ctx.createLinearGradient(bx-16,by,bx+16,by);
    bg.addColorStop(0,'#b8861c');bg.addColorStop(0.5,'#f5cf5a');bg.addColorStop(1,'#b8861c');
    ctx.beginPath();ctx.moveTo(bx-16,by);ctx.lineTo(bx+16,by);
    if(!reduce){ctx.strokeStyle='#e9b42f';ctx.lineWidth=4.5;ctx.shadowColor='#e9b42f';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;}
    ctx.strokeStyle=bg;ctx.lineWidth=4.5;ctx.stroke();
    // soporte metálico
    ctx.fillStyle='#2b2233';ctx.beginPath();ctx.arc(pivX,tr.py,4.5,0,TAU);ctx.fill();
    ctx.strokeStyle='#8a7d96';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='rgba(239,227,200,0.5)';ctx.beginPath();ctx.arc(pivX-1.3,tr.py-1.3,1.2,0,TAU);ctx.fill();
    ctx.restore();
  });
}

function drawGoal(ctx){
  if(!lv.goal)return;
  const gx=lv.goal.x-camX,gy=lv.goal.y;
  if(gx<-40||gx>VW+40)return;
  ctx.strokeStyle='#efe3c8';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy-54);ctx.stroke();
  ctx.fillStyle='#e9b42f';
  ctx.beginPath();ctx.moveTo(gx,gy-54);ctx.lineTo(gx+32,gy-44);ctx.lineTo(gx,gy-34);ctx.fill();
  if(!reduce){
    ctx.save();ctx.globalAlpha=0.3+Math.sin(gameNow*3)*0.22;
    ctx.fillStyle='#e9b42f';ctx.beginPath();ctx.arc(gx,gy-44,24,0,TAU);ctx.fill();
    ctx.restore();
  }
}

// Y del punto de impacto: la plataforma más alta (más cercana a la cima) bajo la columna tx
function boltGroundY(tx){
  let gy=VH-6,top=Infinity;
  platforms.forEach(pl=>{
    if(pl.y<=0||pl.y>=VH)return;
    const plx=movingX(pl);
    if(tx<plx||tx>plx+pl.w)return;
    if(pl.y<top){top=pl.y;gy=pl.y;}
  });
  return gy;
}
function drawBoltWarning(ctx){
  if(!boltWarning)return;
  const tx=boltWarning.x;                       // coords. de mundo
  const prog=Math.min(1,Math.max(0,(gameNow*1000-boltWarning.start)/boltWarning.dur));
  const gy=boltGroundY(tx);
  const pulse=reduce?1:0.5+0.5*Math.sin(gameNow*TAU*(1.2+prog*5.5));  // más rápido al acercarse
  ctx.save();
  ctx.translate(-camX,0);                       // todo el dibujo en coords. de mundo
  // (b) Columna tenue desde la cima hasta el punto de impacto
  const colA=0.04+0.10*prog;
  ctx.fillStyle='rgba(248,232,120,'+colA.toFixed(3)+')';
  ctx.fillRect(tx-9,0,18,gy);
  // (a) Marca en el suelo: elipse que pasa de dorado a blanco y pulsa más fuerte
  const cr=Math.round(233+22*prog),cg=Math.round(180+70*prog),cb=Math.round(47+188*prog);
  const glowA=(0.25+0.6*prog)*(0.55+0.45*pulse);
  const R=40+prog*22;
  ctx.save();
  ctx.translate(tx,gy);ctx.scale(1,0.22);
  const rg=ctx.createRadialGradient(0,0,0,0,0,R);
  rg.addColorStop(0,'rgba('+cr+','+cg+','+cb+','+glowA.toFixed(3)+')');
  rg.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,250,235,'+Math.min(1,glowA+0.1).toFixed(3)+')';
  ctx.beginPath();ctx.arc(tx,gy,2.5+prog*1.5,0,TAU);ctx.fill();
  // Parpadeo irregular del trazo fantasma: dos senos multiplicados (sin parpadeo con reduce)
  const flick=reduce?1:(Math.sin(gameNow*7.3)*0.5+0.5)*(Math.sin(gameNow*3.1)*0.5+0.5);
  if(flick>(0.85-prog*0.72)){
    // Regenerar trazo del rayo cada cierto intervalo
    if(!boltWarning._pts||(!reduce&&gameNow>boltWarning._nextPts)){
      boltWarning._pts=mkBolt(tx,0,tx+(Math.random()-.5)*20,gy,4);
      boltWarning._nextPts=gameNow+0.08+Math.random()*0.14;
    }
    const a=(0.03+prog*.20)*(reduce?0.7:(0.4+Math.random()*.6));
    ctx.globalAlpha=a;
    ctx.strokeStyle='#f8e878';ctx.lineWidth=1.2;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();
    boltWarning._pts.forEach((p,i)=>{i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});
    ctx.stroke();
    // Resplandor en la base de la pantalla
    ctx.globalAlpha=Math.min(1,a*2);
    const gr=ctx.createRadialGradient(tx,VH,0,tx,VH,55);
    gr.addColorStop(0,'rgba(248,220,80,.5)');gr.addColorStop(1,'rgba(248,220,80,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(tx,VH,55,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function drawMuteBtn(ctx){
  const bx=VW-30, by=30, r=16;
  ctx.save();
  ctx.globalAlpha=0.65;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.arc(bx,by,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(239,227,200,0.5)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='rgba(239,227,200,0.9)';ctx.lineWidth=1.5;ctx.strokeStyle='rgba(239,227,200,0.9)';
  // Cuerpo del altavoz
  ctx.beginPath();ctx.moveTo(bx-7,by-5);ctx.lineTo(bx-3,by-5);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+2,by+9);ctx.lineTo(bx-3,by+5);ctx.lineTo(bx-7,by+5);ctx.closePath();ctx.fill();
  if(!musicMuted){
    // Ondas de sonido
    ctx.beginPath();ctx.arc(bx+2,by,8,Math.PI*0.25,Math.PI*1.75);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+2,by,13,Math.PI*0.3,Math.PI*1.7);ctx.stroke();
  } else {
    // X de mute
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx+5,by-6);ctx.lineTo(bx+11,by+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+11,by-6);ctx.lineTo(bx+5,by+6);ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(ctx){
  ctx.font='500 13px "Instrument Sans",Arial,sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(239,227,200,0.5)';ctx.fillText(`Nivel ${levelIdx+1}`,14,14);
  if(P.canDash&&lv.spark){   // icono de dash: se atenúa en cooldown o con el air dash ya usado
    const nw=ctx.measureText(`Nivel ${levelIdx+1}`).width,ix=14+nw+18,iy=21;
    const ready=P.dashT<=0&&P.dashCd<=0&&(P.onGround||!P.airDashUsed);
    ctx.save();ctx.globalAlpha=ready?0.95:0.28;ctx.fillStyle='#fff3c4';
    ctx.beginPath();
    ctx.moveTo(ix,iy-6);ctx.lineTo(ix+1.6,iy-1.6);ctx.lineTo(ix+6,iy);ctx.lineTo(ix+1.6,iy+1.6);
    ctx.lineTo(ix,iy+6);ctx.lineTo(ix-1.6,iy+1.6);ctx.lineTo(ix-6,iy);ctx.lineTo(ix-1.6,iy-1.6);
    ctx.closePath();ctx.fill();ctx.restore();
  }
  if(deathCount>0){ctx.textAlign='right';ctx.fillText(`✕ ${deathCount}`,VW-60,14);}
  drawMuteBtn(ctx);
  if(levelIdx===0&&(gameNow*1000-levelStartTime)<6500){
    const a=Math.min(1,(6500-(gameNow*1000-levelStartTime))/1500);
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.fillStyle='rgba(239,227,200,0.6)';ctx.font='13px "Instrument Sans",Arial,sans-serif';
    ctx.fillText('← → moverse  ·  ↑/espacio = saltar  ·  ↑/espacio en el aire = agarrar trapecio  ·  M = música',VW/2,VH-28);
    ctx.restore();
  }
  // banner de tutorial tras coger la chispa (5 s)
  if(banner){
    const bt=gameNow-banner.t0;
    if(bt<5){
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,bt/0.3,5-bt));
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(14,6,15,0.8)';ctx.fillRect(VW/2-300,VH*0.22-30,600,60);
      ctx.strokeStyle='rgba(233,180,47,0.6)';ctx.lineWidth=1;ctx.strokeRect(VW/2-300,VH*0.22-30,600,60);
      ctx.font='500 17px Gloock,Georgia,serif';ctx.fillStyle='#f5cf5a';
      ctx.fillText('Has atrapado la chispa del rayo',VW/2,VH*0.22-10);
      ctx.font='400 13px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='#efe3c8';
      ctx.fillText('Pulsa Shift para hacer un dash (en móvil: doble toque a un lado)',VW/2,VH*0.22+13);
      ctx.restore();
    }else banner=null;
  }
  ctx.textBaseline='alphabetic';
}

function render(ctx){
  drawBackground(ctx);
  drawPlatforms(ctx);
  drawTrapezes(ctx);
  drawGoal(ctx);
  drawSpark(ctx);
  if(gState==='playing'||gState==='levelEnd'){
    if(P.dashT>0)drawDashTrail(ctx);
    if(P.deathAnim<=0||Math.floor(P.deathAnim*8)%2===0){
      drawAfar(ctx,P.x-camX,P.y,P.facing,P.state,P.animTime,P.swingTheta);
    }
  }
  drawParts(ctx);
  drawBoltWarning(ctx);
  drawGameBolts(ctx);
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(239,227,200,${flashAlpha*0.6})`;
    ctx.fillRect(0,0,VW,VH);
  }
  drawHUD(ctx);
}

    const sx=cl.x-camX*0.4;
    if(sx<-cl.r*2||sx>VW+cl.r*2)return;

function drawEnding(ctx){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,'#0d0410');gr.addColorStop(1,'#060108');
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
  if(ART.tentsT)ctx.drawImage(ART.tentsT,0,0,VW,VH);
  if(!reduce){
    for(let i=0;i<22;i++){
      const cx=((i*73.9+gameNow*45)%VW+VW)%VW,cy=((gameNow*55*(0.5+i%3*0.3)+i*53.1)%VH+VH)%VH;
      ctx.fillStyle=i%3===0?'#e9b42f':i%3===1?'#c1121f':'#efe3c8';
      ctx.globalAlpha=0.65;ctx.fillRect(cx,cy,4,8);
    }
    ctx.globalAlpha=1;
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='500 58px Gloock,Georgia,serif';ctx.fillStyle='#e9b42f';
  ctx.fillText('¡Bravo!',VW/2,VH*0.3);
  ctx.font='400 20px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='#efe3c8';
  ctx.fillText('Afar recuperó la carta.',VW/2,VH*0.47);
  ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='rgba(239,227,200,0.5)';
  ctx.fillText('Y en el silencio de las cavernas, la leyó.',VW/2,VH*0.47+24);
  ctx.globalAlpha=Math.sin(gameNow*4)*0.18+0.82;
  ctx.font='400 14px "Instrument Sans",Arial,sans-serif';ctx.fillStyle='rgba(239,227,200,0.5)';
  ctx.fillText('Espacio / toca para volver',VW/2,VH*0.7);
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}

// ═══════════════════════════════════════════════════════════
//  INICIAR NIVEL
// ═══════════════════════════════════════════════════════════
function initLevelData(idx){
  lv=JSON.parse(JSON.stringify(LEVELS[idx]));
  platforms=lv.platforms;trapezes=lv.trapezes;
  trapezes.forEach(tr=>{tr.omega=tr.theta>0?-0.65:0.65;});
  clouds=[];
  const n=lv.storm===0?7:lv.storm===1?11:16;
  for(let i=0;i<n;i++)
    clouds.push({x:Math.random()*(lv.worldW||1600),y:12+Math.random()*95,r:26+Math.random()*40});
  buildArt();
  initWeather();
}

function startLevel(idx){
  levelIdx=idx;initLevelData(idx);sparkTaken=false;banner=null;PARTS=[];
  initPlayer();snapCamera();deathCount=0;boltWarning=null;flashAlpha=0;gameBolts=[];
  if(lv.lightning)nextLightning=performance.now()+3000+Math.random()*5000;
  levelStartTime=performance.now();gState='playing';
  if(!musicMuted)MUSIC.start();
}

// ═══════════════════════════════════════════════════════════
//  BUCLE PRINCIPAL
// ═══════════════════════════════════════════════════════════
let lastTime=0;
function frame(now){
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;gameNow=now/1000;FDT=dt;
  if(artDirty)buildArt();

  const curJ=wantsJump(),curL=wantsLeft(),curR=wantsRight();
  jumpPressed=curJ&&!lastJumpState;lastJumpState=curJ;
  const justLeft=curL&&!lastLeft,justRight=curR&&!lastRight;
  lastLeft=curL;lastRight=curR;
  const curD=!!(KEY.ShiftLeft||KEY.ShiftRight);
  dashPressed=(curD&&!lastDashState)||tapDashDir!==0;
  lastDashState=curD;
  dashDirReq=tapDashDir;tapDashDir=0;

  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d');
  ctx.resetTransform();ctx.scale(scale*dpr,scale*dpr);
  ctx.clearRect(0,0,VW,VH);

  updateClouds(dt);

  if(gState==='title'){
    drawTitle(ctx);
    if(jumpPressed||KEY.Enter)startLevel(levelIdx);
    if(justLeft)levelIdx=Math.max(0,levelIdx-1);
    if(justRight){if(levelIdx<3&&levelIdx<getSaved())levelIdx++;}
  }else if(gState==='playing'){
    updatePlayer(dt);updateTrapezes(dt);updateCamera(dt);updateStorm();checkSpark();updateParts(dt);render(ctx);
  }else if(gState==='levelEnd'){
    render(ctx);drawLevelEnd(ctx);
    if(jumpPressed){if(levelIdx<3)startLevel(levelIdx+1);else gState='ending';}
  }else if(gState==='ending'){
    drawEnding(ctx);
    if(jumpPressed){gState='title';levelIdx=0;initLevelData(0);}
  }
  drawFilm(ctx);

  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════
//  STORAGE  (seguro en data: y private browsing)
// ═══════════════════════════════════════════════════════════
function getSaved(){try{return Math.min(parseInt(localStorage.getItem('afar-level')||'0'),3);}catch(e){return 0;}}
function setSaved(v){try{localStorage.setItem('afar-level',String(v));}catch(e){}}

// ═══════════════════════════════════════════════════════════
//  RESIZE + ARRANQUE
// ═══════════════════════════════════════════════════════════
function resize(){
  const cv=document.getElementById('c'),rw=window.innerWidth,rh=window.innerHeight;
  scale=Math.min(rw/VW,rh/VH);dpr=Math.min(devicePixelRatio||1,2);
  const cw=Math.round(VW*scale),ch=Math.round(VH*scale);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  artDirty=true;
}
addEventListener('resize',resize);resize();

document.getElementById('c').addEventListener('click',e=>{
  const rect=e.target.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/scale, cy=(e.clientY-rect.top)/scale;
  if(cx>=VW-50&&cx<=VW-10&&cy>=10&&cy<=50)toggleMute();
});

levelIdx=getSaved();
initLevelData(levelIdx);
requestAnimationFrame(frame);
</script>
<script src="assets/sundan-bar.js" defer data-pos="bl"></script>
</body>
